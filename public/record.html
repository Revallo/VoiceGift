<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<title>Record a voice message</title>
<meta property="og:title" content="Record a voice message">
<meta property="og:description" content="15 seconds, straight from your browser. It stays a secret until it opens.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="calm">
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <section data-screen="error" hidden>
    <div class="loading">
      <h1>Hmm.</h1>
      <p class="lead" id="errorText">This gift link doesn’t exist.</p>
      <a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a>
    </div>
  </section>

  <section data-screen="invite" hidden>
    <div class="calm-page">
      <a class="backbtn" href="/" aria-label="Back to home" data-icon="back"></a>
      <p class="calm-from" id="invitedBy"></p>
      <h1 class="calm-title" id="inviteTitle"></h1>

      <form class="stack" id="inviteForm" novalidate>
        <input class="input" id="name" maxlength="40" autocomplete="given-name" placeholder="Your name" aria-label="Your name" required>
        <p class="small muted wrap" id="signedIn" style="margin:-6px 0 0" hidden></p>
        <label class="check">
          <input type="checkbox" id="consent">
          <span>Save my voice &amp; caption for this gift and ASR training.</span>
        </label>
        <p class="small err" id="inviteError" hidden></p>
        <button class="mic-big" type="submit" id="startBtn" aria-label="Start recording"></button>
        <p class="center small muted" style="margin:-4px 0 0">Tap to record · up to 15 seconds</p>
      </form>

      <p class="private-note" data-private></p>
    </div>
  </section>

  <section data-screen="record" hidden>
    <!-- Purrweb 00:04 Recipient Top Pill + Giant Centered Timer -->
    <div class="recipient-pill">
      <span class="sq-avatar" data-icon="mic"></span>
      <div class="rec-info">
        <b id="recEyebrow">For Dimas</b>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="timer" id="timer">0:00</div>
    <p class="center small muted" style="margin:-4px 0 0">up to 15 seconds</p>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="spacer"></div>
    <button type="button" class="recbtn" id="stopBtn" aria-label="Stop recording"></button>
    <p class="center small muted" style="margin:0">tap to finish</p>
  </section>

  <section data-screen="mic" hidden>
    <a class="backbtn" href="/" aria-label="Back to home" data-icon="back"></a>
    <div class="head">
      <div class="eyebrow">microphone</div>
      <h1>Microphone needed</h1>
      <p class="lead" id="micHelp"></p>
    </div>
    <div class="linkbox"><span id="pageLink"></span><button type="button" id="copyPage"></button></div>
    <div class="spacer"></div>
    <button class="btn" type="button" id="retryMic">Try again</button>
  </section>

  <section data-screen="uploading" hidden>
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </section>

  <section data-screen="caption" hidden>
    <div class="calm-page">
      <div class="head">
        <h1 class="calm-title" id="capTitle">Check your words</h1>
        <p class="calm-tip" style="margin:0">Make the words match exactly what you said.</p>
      </div>

      <!-- what the recipient will see when they open the gift: the voice, with its words lighting up -->
      <div class="seen">
        <span class="seen-label" id="seenLabel"></span>
        <div class="seen-clip">
        <div id="seenScene"></div>
        <p class="seen-hint" id="seenHint"></p>
        <div class="panel">
          <div class="who">
            <span class="avatar" id="seenAvatar"></span>
            <div class="grow" style="min-width:0"><div class="name" id="seenName"></div><div class="meta" id="ownDur"></div></div>
            <button type="button" class="seen-play" id="playOwn" aria-label="Play your recording"></button>
          </div>
          <div class="caption" id="seenCaption"></div>
        </div>
        </div>
      </div>

      <div class="typo-studio" id="typoStudio">
        <div class="typo-head">
          <span class="typo-title" id="typoTitle"></span>
          <button type="button" class="fix-all-btn" id="fixAllBtn">fix all</button>
        </div>
        <div class="typo-pills" id="typoPills"></div>
      </div>

      <div class="field">
        <div class="row" style="justify-content:space-between">
          <label for="captionText">your words</label>
          <button type="button" class="linkbtn small" id="resetAsrBtn" hidden>reset</button>
        </div>
        <div class="caption-box-wrap">
          <textarea class="input" id="captionText" maxlength="400" aria-label="Caption"></textarea>
          <span class="edit-badge" id="editBadge"></span>
        </div>
      </div>

      <div class="diff-line" id="diffLine" hidden></div>

      <p class="note" id="mockNote" hidden></p>
      <p class="small err" id="capError" hidden></p>
      <div class="row">
        <button type="button" class="btn ghost grow" id="againBtn"></button>
        <button type="button" class="btn grow" id="sendBtn">Send</button>
      </div>
      <p class="private-note" data-private></p>
    </div>
  </section>

  <section data-screen="done" hidden>
    <div class="calm-page">
      <div id="doneCake" class="done-scene"></div>
      <h1 class="calm-title center" id="doneTitle"></h1>
      <p class="calm-tip center" id="doneCount" style="margin:0"></p>
      <div class="diff-line" id="asrThanksCard" hidden>
        <span class="diff-check" id="doneCheckIco"></span>
        <span id="asrThanksText"></span>
      </div>
      <p class="small muted center" id="doneLead" style="margin:0"></p>
      <p class="private-note" data-private></p>
      <a class="btn ghost" href="/" style="margin-top:8px">Make your own voice gift</a>
    </div>
  </section>
</main>
<script type="module" src="/assets/record.js"></script>
</body>
</html>
