<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<title>Voice Gift — a surprise made of your friends' voices</title>
<meta name="description" content="Friends record short voice wishes. They open as one surprise: a cake, a bouquet or lanterns. No app to install.">
<meta property="og:title" content="Voice Gift">
<meta property="og:description" content="Friends record short voice wishes. Each voice lights a candle.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .pick-head { display: flex; align-items: center; justify-content: space-between; }
  .pick-title { text-align: center; margin: 4px 0 0; }
  .pick-title h1 { font-size: 1.7rem; line-height: 1.15; margin: 0 0 6px; }
  .pick-title p { margin: 0; color: var(--soft); }
  #scene { min-height: 220px; }
  .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pick {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 6px 10px; border-radius: 20px; cursor: pointer;
    background: var(--panel); border: 2px solid var(--line); color: var(--text);
    font: inherit; transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .pick:active, .kind:active { transform: scale(0.97); }
  .pick .em { font-size: 1.8rem; line-height: 1; }
  .pick b { font-size: 0.95rem; }
  .pick small { color: var(--muted); font-size: 0.72rem; }
  .pick.on, .kind.on { border-color: var(--emerald-light); background: var(--panel-hover); box-shadow: 0 8px 24px var(--wash2); }
  .strip-label { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 2px -4px; }
  .strip-label b { font-size: 0.95rem; }
  .strip-label small { color: var(--muted); font-size: 0.75rem; }
  /* sideways scroll of the kinds (each with a small live picture) and of the colours */
  .strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px 2px 6px; margin: 0 -2px; overscroll-behavior-x: contain; }
  .strip::-webkit-scrollbar { display: none; }
  .kind {
    flex: 0 0 132px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 4px; align-items: stretch;
    padding: 8px 8px 10px; border-radius: 18px; cursor: pointer; background: var(--panel); border: 2px solid var(--line);
    color: var(--text); font: inherit; font-weight: 600; font-size: 0.85rem; transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .kind .mini { pointer-events: none; border-radius: 12px; overflow: hidden; background: var(--stage-bg); }
  .colors { gap: 8px; }
  .colors .swatch { flex: 0 0 auto; scroll-snap-align: start; }
  .go { background: var(--emerald-grad); color: #fff; border: 0; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35); }
</style>
</head>
<body>
<main class="app" id="app">
  <section data-screen="pick">
    <div class="pick-head">
      <a class="backbtn" href="/" aria-label="Back to home" data-icon="back"></a>
      <a class="btn ghost sm" id="loginLink" href="/login">Log in</a>
    </div>

    <div class="pick-title">
      <h1>What do you want to make?</h1>
      <p id="pickLead"></p>
    </div>

    <div id="scene" aria-hidden="true"></div>

    <div class="picks" role="radiogroup" aria-label="What to make">
      <button type="button" class="pick" role="radio" data-v="birthday"><span class="em">🎂</span><b>Cake</b><small>birthday</small></button>
      <button type="button" class="pick" role="radio" data-v="graduation"><span class="em">💐</span><b>Bouquet</b><small>graduation</small></button>
      <button type="button" class="pick" role="radio" data-v="wedding"><span class="em">🏮</span><b>Lanterns</b><small>wedding</small></button>
    </div>

    <div class="strip-label"><b id="kindsTitle"></b><small>swipe →</small></div>
    <div class="strip" id="kinds" role="radiogroup"></div>

    <div class="strip-label"><b id="colorsTitle"></b><small id="colorName"></small></div>
    <div class="strip colors" id="colors" role="radiogroup"></div>

    <a class="btn go pulse" id="goBtn" href="/login"></a>
  </section>
</main>
<script type="module">
import { $, $$, h, icon, addStars } from '/assets/common.js';
import { THEMES, createScene, applyTheme } from '/assets/themes.js';
import { me } from '/assets/auth.js';

$$('[data-icon]').forEach((el) => (el.innerHTML = icon[el.dataset.icon]()));
addStars($('#app'), 26, 45);

const PICKS = {
  birthday: { thing: 'cake', emoji: '🎂', kinds: 'Pick a cake', colors: 'Flavor', lead: 'Each friend’s voice lights one candle on the cake.', sample: { recipient: 'Dimas', name: 'Dimas' } },
  graduation: { thing: 'bouquet', emoji: '💐', kinds: 'Pick a bouquet', colors: 'Wrap', lead: 'Each friend’s voice opens one flower in the bouquet.', sample: { recipient: 'Nadia', name: 'Nadia, S.Kom.' } },
  wedding: { thing: 'lanterns', emoji: '🏮', kinds: 'Pick the lanterns', colors: 'Light', lead: 'Each friend’s voice lights one lantern in the sky.', sample: { recipient: 'Rina & Bayu', name: 'Happily ever after' } }
};

const q = new URLSearchParams(location.search);
const state = { occasion: PICKS[q.get('occasion')] ? q.get('occasion') : 'birthday', shape: q.get('shape') || 'classic', flavor: q.get('flavor') || '' };
const gift = (o = {}) => ({
  occasion: state.occasion,
  recipient: PICKS[state.occasion].sample.recipient,
  cake: { flavor: state.flavor, shape: state.shape, name: PICKS[state.occasion].sample.name, ...o }
});

// The big picture: lights up one item at a time.
let timer;
function bigScene() {
  $('#scene').textContent = '';
  const scene = createScene($('#scene'), gift());
  scene.setCandles(12);
  clearInterval(timer);
  let i = 0;
  timer = setInterval(() => { scene.light(i++); if (i >= 12) clearInterval(timer); }, 140);
}

function updateGo() {
  const p = PICKS[state.occasion];
  $('#goBtn').textContent = `Yes, make the ${p.thing} ${p.emoji}`;
  
  const next = `/new?occasion=${state.occasion}&shape=${state.shape}&flavor=${state.flavor}`;
  $('#goBtn').href = next; // /new asks for a login first when needed, and keeps these picks
}

// The kinds (shapes), each with a small live picture, scrolled sideways.
function renderKinds() {
  const d = THEMES[state.occasion].decorate;
  $('#kinds').textContent = '';
  for (const [key, s] of Object.entries(d.shapes)) {
    const mini = h('div', { class: 'mini' });
    const btn = h('button', { type: 'button', class: 'kind' + (key === state.shape ? ' on' : ''), role: 'radio', 'aria-checked': String(key === state.shape), 'data-v': key,
      onclick: () => { state.shape = key; renderKinds(); bigScene(); updateGo(); } }, mini, h('span', {}, s.label));
    $('#kinds').append(btn);
    const sc = createScene(mini, gift({ shape: key }));
    sc.setCandles(8);
    sc.lightAll();
  }
}

function renderColors() {
  const d = THEMES[state.occasion].decorate;
  $('#colors').textContent = '';
  $('#colorName').textContent = d.swatches[state.flavor].label;
  for (const [key, f] of Object.entries(d.swatches)) {
    $('#colors').append(h('button', { type: 'button', class: 'swatch' + (key === state.flavor ? ' on' : ''), role: 'radio', 'aria-checked': String(key === state.flavor), 'aria-label': f.label, title: f.label,
      onclick: () => { state.flavor = key; renderColors(); renderKinds(); bigScene(); updateGo(); } }, h('i', { style: d.swatch(f) })));
  }
}

function show(occasion) {
  const d = THEMES[occasion].decorate;
  if (occasion !== state.occasion || !d.shapes[state.shape]) state.shape = 'classic';
  if (occasion !== state.occasion || !d.swatches[state.flavor]) state.flavor = d.flavor;
  state.occasion = occasion;
  const p = PICKS[occasion];
  applyTheme(occasion); // the background takes this occasion's colours
  $$('.pick').forEach((b) => {
    const on = b.dataset.v === occasion;
    b.classList.toggle('on', on);
    b.setAttribute('aria-checked', String(on));
  });
  $('#pickLead').textContent = p.lead;
  $('#kindsTitle').textContent = p.kinds;
  $('#colorsTitle').textContent = p.colors;
  $('#kinds').scrollLeft = $('#colors').scrollLeft = 0;
  renderKinds();
  renderColors();
  bigScene();
  updateGo();
}
$$('.pick').forEach((b) => b.addEventListener('click', () => show(b.dataset.v)));
show(state.occasion);

me().then((user) => {
  if (!user) return;
  $('#loginLink').textContent = 'My gifts';
  $('#loginLink').href = '/account';
});
</script>
</body>
</html>
