<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<meta name="robots" content="noindex">
<title>Your account · Voice Gift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <!-- /signup and /login: a title, the form. Wears the colours of the occasion picked before (?occasion= or ?next=). -->
  <section data-screen="auth" hidden>
    <a class="backbtn" href="/" id="authBack" aria-label="Back" data-icon="back" hidden></a>
    <div class="stack" style="gap:8px;margin-top:7vh">
      <h1 id="authTitle"></h1>
      <p class="lead" id="authLead"></p>
      <div id="authBox" style="margin-top:16px"></div>
    </div>
  </section>

  <!-- /account: who you are, the gifts you made, three things to press. Each opens a sheet. -->
  <section data-screen="me" hidden>
    <div class="profile-head">
      <h1 id="hello"></h1>
      <small id="meEmail"></small>
    </div>

    <div>
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2>Your gifts</h2>
        <a class="linkbtn" href="/new">New gift</a>
      </div>
      <div class="list" id="gifts"></div>
    </div>

    <div class="nav-list">
      <button type="button" class="nav-row" id="rowEditProfile">
        <div class="nav-info"><b>Edit profile</b><small id="rowProfileSub"></small></div>
      </button>
      <button type="button" class="nav-row" id="rowSecurity">
        <div class="nav-info"><b id="rowSecurityTitle">Change password</b></div>
      </button>
      <button type="button" class="nav-row" id="logout">
        <div class="nav-info"><b style="color:var(--coral)">Log out</b></div>
      </button>
    </div>
  </section>
</main>
<script type="module" src="/assets/account.js"></script>
</body>
</html>
