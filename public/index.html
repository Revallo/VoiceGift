<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<title>Voice Gift — a surprise made of your friends' voices</title>
<meta name="description" content="Friends record short voice wishes. They open as one surprise: a cake, a bouquet or lanterns. No app to install.">
<meta property="og:title" content="Voice Gift">
<meta property="og:description" content="Friends record short voice wishes. Each voice lights a candle.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <section data-screen="home" hidden>
    <div class="row" style="justify-content:space-between">
      <span class="brand home-brand"><span class="home-logo" id="homeLogo"></span>Voice Gift</span>
      <a class="profile-btn" href="/account" id="profileLink"><span class="profile-ava" id="profileAva"></span>Profile</a>
    </div>

    <!-- the three gifts, drawn live; each one starts making that kind of gift -->
    <div class="home-hero">
      <a class="home-gift left" id="heroBouquet" href="/new?occasion=graduation" aria-label="Make a bouquet"></a>
      <a class="home-gift right" id="heroLanterns" href="/new?occasion=wedding" aria-label="Make lanterns"></a>
      <a class="home-gift mid" id="heroCake" href="/new?occasion=birthday" aria-label="Make a cake"></a>
    </div>

    <div class="home-title">
      <p id="hello"></p>
      <h1>What would you like to do?</h1>
    </div>


    <div class="stack" style="gap:12px">
      <a class="choice" href="/new" id="makeGift">
        <span class="choice-ico" id="makeIco"></span>
        <span class="choice-text"><b>Make a gift</b><small>Collect your friends’ voices for someone.</small></span>
      </a>
      <button type="button" class="choice" id="openToggle" aria-expanded="false">
        <span class="choice-ico" id="openIco"></span>
        <span class="choice-text"><b>Open your gift</b><small>Received a link? Paste it here.</small></span>
      </button>
      <form class="card stack" id="openForm" style="gap:12px" novalidate hidden>
        <input class="input" id="openLink" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Paste your gift link" aria-label="Your gift link">
        <p class="small err" id="openError" hidden></p>
        <button class="btn" type="submit">Continue</button>
      </form>
      <a class="choice" href="/account" id="myGifts">
        <span class="choice-ico" id="mineIco"></span>
        <span class="choice-text"><b>Dashboard</b><small>The gifts you’re making for others.</small></span>
      </a>
    </div>
  </section>
</main>
<script type="module">
import { $, h, api, icon, addStars, showScreen, initials, openSheet, closeSheet } from '/assets/common.js';
import { noteCard, markRead, stopNoteVoice } from '/assets/thanksnote.js';
$('#homeLogo').innerHTML = icon.mic(15); // static icon markup
import { me } from '/assets/auth.js';
import { theme, createScene, firstName } from '/assets/themes.js';

const user = await me();
if (!user) location.replace('/login');
else {
  addStars($('#app'), 20, 40);
  $('#makeIco').innerHTML = icon.plus(22);
  $('#openIco').innerHTML = icon.gift(22);
  $('#mineIco').innerHTML = icon.sparkle(22);
  $('#profileAva').textContent = initials(user.name);
  $('#hello').textContent = `Hi, ${user.name}`;
  showScreen('home');
  drawGifts(firstName(user.name));
  showThanks();
}

function drawGifts(name) {
  for (const [occasion, host] of [['birthday', '#heroCake'], ['graduation', '#heroBouquet'], ['wedding', '#heroLanterns']]) {
    const scene = createScene($(host), { occasion, recipient: name, cake: { name: theme(occasion).decorate.name(name) } });
    scene.setCandles(10);
    scene.lightAll();
  }
}

$('#openToggle').addEventListener('click', () => {
  const form = $('#openForm');
  form.hidden = !form.hidden;
  $('#openToggle').setAttribute('aria-expanded', String(!form.hidden));
  if (!form.hidden) $('#openLink').focus();
});

$('#openForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const m = /\/r\/([a-z0-9-]{3,40})\/?\?(?:.*&)?k=([\w-]+)/.exec($('#openLink').value.trim());
  $('#openError').hidden = Boolean(m);
  if (!m) {
    $('#openError').textContent = 'That doesn’t look like a gift link. Copy the whole link and try again.';
    return;
  }
  location.href = `/r/${m[1]}?k=${m[2]}`;
});

// A new thank-you pops up once, here. After it's closed it waits in the Dashboard for 7 days, then it's gone.
async function showThanks() {
  const { thanks = [] } = await api('/api/account?thanks=1').catch(() => ({}));
  const fresh = thanks.filter((n) => !n.read).reverse(); // oldest first
  const next = () => {
    const n = fresh.shift();
    if (!n) return;
    const burst = h('div', { class: 'thanks-burst', 'aria-hidden': 'true' },
      ...['💛', '✨', '🎉', '💌', '✨', '🎊', '💛', '✨'].map((e, i) => h('i', { style: `--a: ${i * 45}deg; animation-delay: ${i * 0.03}s` }, e)));
    const ok = h('button', { type: 'button', class: 'btn', onclick: closeSheet }, fresh.length ? 'Next' : 'Close');
    openSheet({
      title: '', content: [burst, noteCard(n, { big: true }), h('p', { class: 'small muted center', style: { margin: '0' } }, 'Saved in your Dashboard for 7 days.'), ok],
      onClose: () => { stopNoteVoice(); markRead(n.slug); setTimeout(next, 350); }
    });
  };
  next();
}
</script>
</body>
</html>
