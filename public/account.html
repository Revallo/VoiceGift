<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<meta name="robots" content="noindex">
<title>Your account · Voice Gift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/soft.css">
<script>
// Files are served from the browser's cache and refreshed in the background (vercel.json). Right after a deploy one
// page can get old and new files mixed; if that breaks a module, load once more (by then the cache is fresh).
addEventListener('error', (e) => {
  if (!/export named|module script failed|Importing a module/i.test(e.message || '') || sessionStorage.getItem('vg-reloaded')) return;
  sessionStorage.setItem('vg-reloaded', '1');
  location.reload();
}, true);
addEventListener('load', () => setTimeout(() => sessionStorage.removeItem('vg-reloaded'), 4000));
</script>
<script type="speculationrules">
{"prerender": [{"where": {"href_matches": ["/", "/new", "/new?*", "/account", "/gifts"]}, "eagerness": "moderate"}],
 "prefetch": [{"where": {"and": [{"href_matches": "/*"}, {"not": {"href_matches": "/api/*"}}]}, "eagerness": "moderate"}]}
</script>
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <!-- /signup and /login: the occasion's colours, one big emoji, a title, the Google button -->
  <section data-screen="auth" hidden>
    <header class="top-bar">
      <a class="icon-btn" href="/" id="authBack" aria-label="Back" data-icon="back" hidden></a>
    </header>
    <div class="auth-wrap">
      <div class="auth-emoji" id="authEmoji">🎁</div>
      <h1 id="authTitle"></h1>
      <p class="lead" id="authLead"></p>
      <div id="authBox"></div>
    </div>
  </section>

  <!-- /account: who you are, your numbers, settings (each opens a sheet) -->
  <section data-screen="me" hidden>
    <div class="me-head">
      <span class="me-ava" id="acctAvatar" aria-hidden="true"></span>
      <h1 id="hello"></h1>
      <p class="lead" id="meEmail"></p>
    </div>
    <div class="stat-row">
      <div class="stat-tile"><b class="t-num" id="acctHeroVal">0</b><span>Voices</span><i data-icon="mic"></i></div>
      <div class="stat-tile alt"><b class="t-num" id="acctGiftCount">0</b><span>Gifts</span><i data-icon="gift"></i></div>
    </div>
    <div class="nav-list">
      <button type="button" class="nav-row" id="rowEditProfile">
        <span class="nav-ico" data-icon="edit"></span>
        <div class="nav-info"><b>Edit profile</b><small id="rowProfileSub"></small></div>
        <span class="nav-chev" data-icon="chevronRight"></span>
      </button>
      <button type="button" class="nav-row danger" id="logout">
        <span class="nav-ico" data-icon="lock"></span>
        <div class="nav-info"><b>Log out</b><small>This device only</small></div>
        <span class="nav-chev" data-icon="chevronRight"></span>
      </button>
    </div>
  </section>
  <!-- /gifts: the gifts you made, and the thank-yous you got (kept 7 days after they popped up on home) -->
  <section data-screen="gifts" hidden>
    <div class="gifts-head">
      <h1>Your gifts</h1>
      <a class="icon-btn make-btn" href="/new" aria-label="Make a gift" data-icon="plus"></a>
    </div>
    <div class="list" id="gifts"></div>
    <div class="stack" id="thanksSec" style="gap:10px" hidden>
      <div class="sec-bar"><h2>Thank-yous</h2><span class="t-label">7 days</span></div>
      <div class="stack" id="thanksArchive" style="gap:10px"></div>
    </div>
  </section>
</main>
<script type="module" src="/assets/account.js"></script>
</body>
</html>
