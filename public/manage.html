<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A0C19">
<meta name="robots" content="noindex">
<title>Gift dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>
  <section data-screen="error" hidden>
    <div class="loading"><h1>Hmm.</h1><p class="lead" id="errorText"></p><a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a></div>
  </section>
  <section data-screen="main" hidden>
    <a class="brand" href="/" style="font-size:15px"><span class="logo" data-logo style="width:26px;height:26px"></span>Voice Gift</a>
    <div class="head">
      <div class="eyebrow">Your dashboard</div>
      <h1 id="title"></h1>
      <p class="lead" id="status"></p>
    </div>
    <div id="cake"></div>
    <div class="stack">
      <div class="row"><h2 class="grow">Who has recorded</h2><button class="btn ghost sm" id="refresh">Refresh</button></div>
      <p class="small muted" style="margin:-4px 0 0">You see who recorded, not what they said.</p>
      <div class="list" id="list"></div>
    </div>
    <div class="card stack">
      <b>Invite more friends</b>
      <div class="linkbox"><span id="friendLink"></span><button type="button" id="copyFriend"></button></div>
      <a class="btn wa" id="waBtn" target="_blank" rel="noopener"></a>
    </div>
    <div class="card stack">
      <div><b id="recipientTitle"></b><div class="small muted">Send it any time. It stays locked until it opens.</div></div>
      <div class="linkbox"><span id="recipientLink"></span><button type="button" id="copyRecipient"></button></div>
      <a class="btn ghost" id="openReveal" target="_blank" rel="noopener">Preview their page</a>
    </div>
    <div class="card stack" id="demoCard">
      <div><b>Demo</b><div class="small muted">Open the gift right now instead of waiting.</div></div>
      <button class="btn ghost" id="unlockNow">Open it now</button>
    </div>
  </section>
</main>
<script type="module" src="/assets/manage.js"></script>
</body>
</html>
