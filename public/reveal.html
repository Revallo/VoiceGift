<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<meta name="robots" content="noindex">
<title>A voice gift for you</title>
<meta property="og:title" content="A voice gift for you">
<meta property="og:description" content="Your friends made you something. Turn your sound on.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/birthday-reveal.css">
<link rel="stylesheet" href="/assets/soft.css">
<script>
// Files are served from the browser's cache and refreshed in the background (vercel.json). Right after a deploy one
// page can get old and new files mixed; if that breaks a module, load once more (by then the cache is fresh).
addEventListener('error', (e) => {
  if (!/export named|module script failed|Importing a module/i.test(e.message || '') || sessionStorage.getItem('vg-reloaded')) return;
  sessionStorage.setItem('vg-reloaded', '1');
  location.reload();
}, true);
addEventListener('load', () => setTimeout(() => sessionStorage.removeItem('vg-reloaded'), 4000));
</script>
<script type="speculationrules">
{"prerender": [{"where": {"href_matches": ["/", "/new", "/new?*", "/account", "/gifts"]}, "eagerness": "moderate"}],
 "prefetch": [{"where": {"and": [{"href_matches": "/*"}, {"not": {"href_matches": "/api/*"}}]}, "eagerness": "moderate"}]}
</script>
</head>
<body class="reveal-page">
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <section data-screen="error" hidden>
    <div class="loading"><h1>Hmm.</h1><p class="lead" id="errorText"></p><a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a></div>
  </section>

  <!-- After logging in: the 4-digit PIN. The 4th digit opens the gift. -->
  <section data-screen="verify" hidden>
    <header class="top-bar">
      <a class="icon-btn" href="/" aria-label="Back to home" data-icon="back"></a>
      <span class="top-pill" id="verifyOrganizer">A voice gift</span>
      <span class="icon-btn ghost" aria-hidden="true"></span>
    </header>
    <div class="verify-wrap">
      <div class="auth-emoji verify-lock" id="verLogo"></div>
      <h1 id="verifyHeroTitle">For you</h1>
      <span class="badge-pill" id="verifyCountBadge">Secret voices</span>
      <form class="stack verify-form" id="verifyForm" novalidate>
        <b class="t-label" id="verifyPinTitle">Type your PIN</b>
        <div class="pin-box-row" id="pinBoxRow" role="group" aria-label="4-digit PIN code">
          <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pin-idx="0" autocomplete="one-time-code" placeholder="•" aria-label="Digit 1">
          <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pin-idx="1" placeholder="•" aria-label="Digit 2">
          <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pin-idx="2" placeholder="•" aria-label="Digit 3">
          <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pin-idx="3" placeholder="•" aria-label="Digit 4">
        </div>
        <input type="hidden" id="verifyPinInput" value="">
        <p class="small err" id="verifyError" role="alert" hidden></p>
        <p class="small muted center" id="verifyHelp" style="margin:0"></p>
      </form>
    </div>
  </section>

  <section data-screen="scene" hidden>
    <header class="top-bar">
      <a class="icon-btn" href="/" aria-label="Back to home" data-icon="back"></a>
      <span class="top-pill"><i id="revLogo"></i><span id="eyebrow"></span></span>
      <span class="icon-btn sound-on" aria-label="Sound on" data-icon="speaker"></span>
    </header>
    <div class="reveal-head">
      <span class="badge-pill" id="revealAccessBadge" hidden>Keepsake</span>
      <p class="birthday-eyebrow" id="birthdayEyebrow" hidden></p>
      <h1 id="title"></h1>
      <p class="lead" id="sub"></p>
    </div>
    <p class="reveal-dedication" id="birthdayDedication"></p>
    <div class="stage-showcase">
      <div id="cake" style="width:100%"></div>
    </div>
    <div id="panel"></div>
    <div id="bottom" class="stack"></div>
  </section>
</main>
<div class="confetti" id="confetti" hidden></div>
<script type="module" src="/assets/reveal.js"></script>
</body>
</html>
