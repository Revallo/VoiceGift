<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<title>Voice Gift — voices from your friends, with their words</title>
<meta name="description" content="Friends record short voice wishes. They open as one surprise: a cake, a bouquet or lanterns. No app to install.">
<meta property="og:title" content="Voice Gift">
<meta property="og:description" content="Friends record short voice wishes. Each voice lights a candle.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice Gift">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="clean">
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <!-- Home: the voices your friends sent you, each with its words. The mic in the bar sends one. -->
  <section data-screen="home" hidden>
    <h1 class="page-title">Voices</h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="on" data-box="inbox" id="tabInbox">Inbox</button>
      <button type="button" role="tab" data-box="sent" id="tabSent">Sent</button>
    </div>
    <div class="rows" id="voices"></div>
  </section>
</main>
<script type="module">
import { $, $$, h, api, showScreen, openSheet, closeSheet } from '/assets/common.js';
import { noteCard, markRead, stopNoteVoice } from '/assets/thanksnote.js';
import { me } from '/assets/auth.js';
import { tabBar } from '/assets/tabbar.js';
import { voiceCard, openSend, stopVoices } from '/assets/voicebox.js';

let friends = [], boxes = { inbox: [], sent: [] }, box = 'inbox';
const user = await me();
if (!user) location.replace('/login');
else {
  tabBar({ onMic: send });
  $$('.tabs button').forEach((b) => (b.onclick = () => { box = b.dataset.box; draw(); }));
  await load();
  showScreen('home');
  if (new URLSearchParams(location.search).has('send')) { history.replaceState(null, '', '/'); send(); }
  else showThanks();
}

async function load() {
  [{ friends }, boxes] = await Promise.all([api('/api/friends'), api('/api/voice')]).catch(() => [{ friends: [] }, { inbox: [], sent: [] }]);
  draw();
}

// A voice needs a friend to go to: without one, the button leads to the friend link.
function send(reply) {
  if (!reply && !friends.length) return (location.href = '/friends');
  openSend({ friends, reply, onSent: () => { if (!reply) box = 'sent'; load(); } });
}

function draw() {
  stopVoices();
  $$('.tabs button').forEach((b) => { b.classList.toggle('on', b.dataset.box === box); b.setAttribute('aria-selected', String(b.dataset.box === box)); });
  const fresh = boxes.inbox.filter((v) => !v.heard).length;
  $('#tabInbox').replaceChildren('Inbox', fresh ? h('i', {}, String(fresh)) : '');
  const list = boxes[box];
  const empty = !friends.length
    ? h('div', { class: 'empty', id: 'noFriends' }, h('b', {}, 'No friends yet'),
        h('p', {}, 'Send someone your friend link. Then you can send each other voices.'),
        h('a', { class: 'btn', href: '/friends' }, 'Get my friend link'))
    : h('div', { class: 'empty' }, h('p', {}, box === 'inbox' ? 'Nothing here yet.' : 'You haven’t sent a voice yet.'),
        h('button', { type: 'button', class: 'btn', onclick: () => send() }, 'Send a voice'));
  $('#voices').replaceChildren(...(list.length ? list.map((v) => voiceCard(v, { onReply: send })) : [empty]));
}

// A new thank-you pops up once, here. After it's closed it waits in the Profile for 7 days, then it's gone.
async function showThanks() {
  const { thanks = [] } = await api('/api/account?thanks=1').catch(() => ({}));
  const fresh = thanks.filter((n) => !n.read).reverse(); // oldest first
  const next = () => {
    const n = fresh.shift();
    if (!n) return;
    const burst = h('div', { class: 'thanks-burst', 'aria-hidden': 'true' },
      ...['💛', '✨', '🎉', '💌', '✨', '🎊', '💛', '✨'].map((e, i) => h('i', { style: `--a: ${i * 45}deg; animation-delay: ${i * 0.03}s` }, e)));
    const ok = h('button', { type: 'button', class: 'btn', onclick: closeSheet }, fresh.length ? 'Next' : 'Close');
    openSheet({
      title: '', content: [burst, noteCard(n, { big: true }), h('p', { class: 'small muted center', style: { margin: '0' } }, 'Saved in your Profile for 7 days.'), ok],
      onClose: () => { stopNoteVoice(); markRead(n.slug); setTimeout(next, 350); }
    });
  };
  next();
}
</script>
</body>
</html>
