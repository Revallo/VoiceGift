<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A0C19">
<meta name="robots" content="noindex">
<title>Your account · Voice Gift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <!-- /signup and /login -->
  <section data-screen="auth" hidden>
    <div class="topbar"><a class="backbtn" href="/" aria-label="Back to the home page" data-icon="back"></a><a class="brand" href="/" style="font-size:15px"><span class="logo" data-logo style="width:26px;height:26px"></span>Voice Gift</a></div>
    <div class="head">
      <h1 id="authTitle"></h1>
      <p class="lead" id="authLead"></p>
    </div>
    <div id="authBox"></div>
  </section>

  <!-- /account -->
  <section data-screen="me" hidden>
    <div class="topbar"><a class="backbtn" href="/" aria-label="Back to the home page" data-icon="back"></a><a class="brand" href="/" style="font-size:15px"><span class="logo" data-logo style="width:26px;height:26px"></span>Voice Gift</a></div>
    <div class="head">
      <div class="eyebrow">Your account</div>
      <h1 id="hello"></h1>
      <p class="lead wrap" id="meEmail"></p>
    </div>
    <div class="stack">
      <h2>Your gifts</h2>
      <div class="list" id="gifts"></div>
    </div>
    <a class="btn" href="/new">Create a gift</a>
    <div class="spacer"></div>
    <button type="button" class="btn ghost" id="logout">Log out</button>
  </section>
</main>
<script type="module" src="/assets/account.js"></script>
</body>
</html>
