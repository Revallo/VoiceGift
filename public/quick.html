<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<title>Record a voice · Voice Gift</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <!-- The Record tab: record first, choose who it's for after. The recording stays on this phone until then. -->
  <section data-screen="ready" hidden>
    <div class="calm-page">
      <h1 class="calm-title">Record a voice</h1>
      <p class="calm-tip">Up to 15 seconds. You choose who it’s for after.</p>
      <div class="spacer"></div>
      <button type="button" class="mic-big" id="startBtn" aria-label="Start recording"></button>
      <p class="center small muted" style="margin:-6px 0 0">Tap to record</p>
      <p class="small err center" id="readyError" hidden></p>
      <div class="spacer"></div>
    </div>
  </section>

  <section data-screen="record" hidden>
    <div class="spacer"></div>
    <div class="timer" id="timer">0:00</div>
    <p class="center small muted" style="margin:-4px 0 0">Up to 15 seconds</p>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="spacer"></div>
    <button type="button" class="recbtn" id="stopBtn" aria-label="Stop recording"></button>
    <p class="center small muted" style="margin:0">Tap to finish</p>
  </section>

  <section data-screen="mic" hidden>
    <div class="head">
      <h1>Microphone needed</h1>
      <p class="lead" id="micHelp"></p>
    </div>
    <div class="spacer"></div>
    <button class="btn" type="button" id="retryMic">Try again</button>
  </section>

  <section data-screen="pick" hidden>
    <div class="calm-page">
      <h1 class="calm-title">Who is this for?</h1>
      <div class="row">
        <button type="button" class="seen-play" id="playDraft" aria-label="Play your recording" style="margin-left:-10px"></button>
        <span class="soft" id="draftDur"></span>
        <span class="grow"></span>
        <button type="button" class="linkbtn" id="againBtn">Record again</button>
      </div>

      <div id="invitesBox" hidden>
        <h2>Waiting for your voice</h2>
        <div class="nav-list" id="invites" style="margin-top:8px"></div>
      </div>

      <div id="friendsBox" hidden>
        <h2>A new gift for a friend</h2>
        <div class="people" id="friends" style="margin-top:12px"></div>
      </div>

      <form class="stack" id="linkForm" novalidate>
        <div class="field">
          <label for="giftLink">Paste the link you were sent</label>
          <input class="input" id="giftLink" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="…/g/…">
        </div>
        <p class="small err" id="linkError" hidden></p>
        <button class="btn" type="submit">Continue</button>
      </form>
      <a class="btn ghost" href="/new?draft=1" style="align-self:flex-start">Make a new gift with this voice</a>
    </div>
  </section>
</main>
<script type="module">
import { $, h, api, icon, showScreen, tabBar, toast, initials } from '/assets/common.js';
import { requireLogin } from '/assets/auth.js';
import { theme } from '/assets/themes.js';
import { startRecording, micSupported, micErrorHelp } from '/assets/recorder.js';
import { saveDraft, loadDraft, clearDraft } from '/assets/draft.js';

$('#startBtn').innerHTML = icon.mic(48);
$('#stopBtn').innerHTML = icon.stop(34);
const bars = [];
for (let i = 0; i < 28; i++) { const b = h('i'); bars.push(b); $('#meter').append(b); }
let rec = null;
let draft = null;
let audio = null;
const err = (el, msg) => { el.textContent = msg || ''; el.hidden = !msg; };
const mmss = (s) => `0:${String(Math.min(15, Math.round(s))).padStart(2, '0')}`;

function ready(msg) {
  err($('#readyError'), msg);
  showScreen('ready');
  tabBar('record');
}

async function begin() {
  if (!micSupported()) return micHelp();
  $('#timer').textContent = '0:00';
  bars.forEach((b) => (b.style.height = '6px'));
  let k = 0;
  let auto = false;
  try {
    rec = await startRecording({
      maxSec: 15,
      onLevel: (lv) => { bars[k++ % bars.length].style.height = `${Math.round(6 + lv * 80)}px`; },
      onTick: (s) => { $('#timer').textContent = mmss(Math.floor(s)); },
      onAutoStop: () => { if (!auto) { auto = true; finish(); } }
    });
  } catch (e) {
    return micHelp(e);
  }
  tabBar(false); // nothing else to press while it records
  showScreen('record');
}

function micHelp(e) {
  $('#micHelp').textContent = micErrorHelp(e);
  showScreen('mic');
  tabBar('record');
}

async function finish() {
  if (!rec) return;
  const r = rec;
  rec = null;
  const { wav, durationSec } = await r.stop();
  if (durationSec < 1) return ready('That was too short. Please record again.');
  try {
    await saveDraft(wav, durationSec);
  } catch {
    return ready('This phone couldn’t keep the recording. Open the gift’s link and record there instead.');
  }
  draft = { wav, durationSec };
  pick();
}

// The recording is on this phone. Now: which gift is it for?
async function pick() {
  $('#draftDur').textContent = `Your recording · ${mmss(draft.durationSec)}`;
  $('#playDraft').innerHTML = icon.play(18);
  showScreen('pick');
  tabBar('record');
  const { home = {} } = await api('/api/account?home=1').catch(() => ({}));
  const invites = home.invites || [];
  $('#invites').replaceChildren(...invites.map((g) => h('a', { class: 'choice', href: `/g/${g.slug}?draft=1` },
    h('span', { class: 'choice-text' }, h('b', {}, `For ${g.recipient}`), h('small', {}, `${g.organizer} invited you · ${theme(g.occasion).label}`)))));
  $('#invitesBox').hidden = !invites.length;
  const friends = home.following || [];
  $('#friends').replaceChildren(...friends.map((f) => h('a', { class: 'person', href: `/new?for=${encodeURIComponent(f.name)}&draft=1` },
    h('span', { class: 'avatar' }, initials(f.name)), h('span', {}, f.name))));
  $('#friendsBox').hidden = !friends.length;
}

$('#startBtn').addEventListener('click', begin);
$('#retryMic').addEventListener('click', begin);
$('#stopBtn').addEventListener('click', finish);
$('#againBtn').addEventListener('click', async () => {
  audio?.pause();
  await clearDraft();
  draft = null;
  await begin();
});
$('#playDraft').addEventListener('click', () => {
  if (audio && !audio.paused) { audio.pause(); return; }
  audio ||= Object.assign(new Audio(), {
    onplay: () => { $('#playDraft').innerHTML = icon.pause(18); },
    onpause: () => { $('#playDraft').innerHTML = icon.play(18); }
  });
  audio.src = URL.createObjectURL(draft.wav);
  audio.play().catch(() => toast('Couldn’t play the recording.'));
});
$('#linkForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const m = /\/g\/([a-z0-9-]{3,40})/.exec($('#giftLink').value.trim());
  err($('#linkError'), m ? '' : 'That doesn’t look like a link to record for a gift. Copy the whole link and try again.');
  if (m) location.href = `/g/${m[1]}?draft=1`;
});

if (await requireLogin()) {
  draft = await loadDraft(); // a recording from before that hasn't found its gift yet
  if (draft) pick();
  else ready();
}
</script>
</body>
</html>
