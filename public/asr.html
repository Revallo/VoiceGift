<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>ASR · Voice Gift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .asr { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 40px; }
  .asr .box { border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .asr .box h2 { margin: 0 0 8px; font-size: 15px; }
  .asr .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .asr .num { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .asr .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .asr .dot.ok { background: #4caf7a; } .asr .dot.bad { background: #d9534f; }
  .asr .rows { display: flex; flex-direction: column; gap: 8px; }
  .asr .rowx { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; }
  .asr .rowx > div { min-width: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main class="app" id="app">
  <section class="asr">
    <a class="backbtn" href="/" aria-label="Back" data-icon="back"></a>
    <h1 style="margin:28px 0 0">ASR</h1>
    <p class="small muted" style="margin:0">For the team: Taiwan Mobile’s speech recognition and the corrected captions sent back to it.</p>
    <form id="keyForm" class="box stack" style="gap:8px" hidden>
      <label class="small" for="key">Admin key</label>
      <input class="input" id="key" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Open</button>
    </form>
    <div id="out" class="stack" style="gap:14px"></div>
  </section>
</main>
<script type="module" src="/assets/asr.js"></script>
</body>
</html>
