<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<title>Voice Gift — a surprise made of your friends' voices</title>
<meta name="description" content="Friends record short voice wishes. They open as one surprise: a cake, a bouquet or lanterns. No app to install.">
<meta property="og:title" content="Voice Gift">
<meta property="og:description" content="Friends record short voice wishes. Each voice lights a candle.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <section data-screen="home" hidden>
    <div class="row" style="justify-content:space-between">
      <a class="brand" href="/"><span class="logo" data-logo></span>voice gift</a>
      <a class="btn ghost sm" href="/account" id="profileLink">My gifts</a>
    </div>

    <div class="home-title">
      <p id="hello"></p>
      <h1>What would you like to do?</h1>
    </div>

    <div class="stack" id="thanksBox" style="gap:10px" hidden>
      <div class="eyebrow">Thank-you notes</div>
      <div class="stack" id="thanksList" style="gap:10px"></div>
    </div>

    <div class="stack" style="gap:12px">
      <a class="choice" href="/start" id="makeGift">
        <span class="choice-ico" id="makeIco"></span>
        <span class="choice-text"><b>Make a gift</b><small>Collect your friends’ voices for someone.</small></span>
      </a>
      <button type="button" class="choice" id="openToggle" aria-expanded="false">
        <span class="choice-ico" id="openIco"></span>
        <span class="choice-text"><b>Open your gift</b><small>Received a link? Paste it here.</small></span>
      </button>
      <form class="card stack" id="openForm" style="gap:12px" novalidate hidden>
        <input class="input" id="openLink" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Paste your gift link" aria-label="Your gift link">
        <p class="small err" id="openError" hidden></p>
        <button class="btn" type="submit">Continue</button>
      </form>
    </div>
  </section>
</main>
<script type="module">
import { $, h, api, icon, addStars, showScreen, fmtAgo } from '/assets/common.js';
import { me } from '/assets/auth.js';
import { theme } from '/assets/themes.js';

const user = await me();
if (!user) location.replace('/login');
else {
  addStars($('#app'), 20, 40);
  $('[data-logo]').innerHTML = icon.gift(14);
  $('#makeIco').innerHTML = icon.plus(22);
  $('#openIco').innerHTML = icon.gift(22);
  $('#hello').textContent = `Hi, ${user.name}`;
  showScreen('home');
  showThanks();
}

$('#openToggle').addEventListener('click', () => {
  const form = $('#openForm');
  form.hidden = !form.hidden;
  $('#openToggle').setAttribute('aria-expanded', String(!form.hidden));
  if (!form.hidden) $('#openLink').focus();
});

$('#openForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const m = /\/r\/([a-z0-9-]{3,40})\/?\?(?:.*&)?k=([\w-]+)/.exec($('#openLink').value.trim());
  $('#openError').hidden = Boolean(m);
  if (!m) {
    $('#openError').textContent = 'That doesn’t look like a gift link. Copy the whole link and try again.';
    return;
  }
  location.href = `/r/${m[1]}?k=${m[2]}`;
});

// The notes from people this account recorded for. Unread ones are marked "New" this once.
async function showThanks() {
  const { thanks = [] } = await api('/api/account?thanks=1').catch(() => ({}));
  if (!thanks.length) return;
  $('#thanksList').replaceChildren(...thanks.map((n) => h('article', { class: 'thanks-card' + (n.read ? '' : ' new') },
    h('div', { class: 'thanks-head' },
      h('span', { class: 'thanks-emoji' }, theme(n.occasion).emoji),
      h('b', {}, `${n.from} says thank you`),
      !n.read && h('span', { class: 'thanks-new' }, 'New')),
    h('p', {}, n.text),
    h('small', {}, fmtAgo(n.at)))));
  $('#thanksBox').hidden = false;
  if (thanks.some((n) => !n.read)) api('/api/account', { method: 'POST', json: { action: 'thanks-read' } }).catch(() => {});
}
</script>
</body>
</html>
