<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<meta name="robots" content="noindex">
<title>Gift dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/soft.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>
  <section data-screen="error" hidden>
    <div class="loading"><h1>Hmm.</h1><p class="lead" id="errorText"></p><a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a></div>
  </section>
  <section data-screen="main" hidden>
    <!-- One page for the organizer: the gift, then three things to do, each in a sheet -->
    <header class="top-bar">
      <a class="icon-btn" href="/account" aria-label="Back to dashboard" data-icon="back"></a>
      <span class="top-pill" id="title">Gift</span>
      <a class="icon-btn" id="editDesignLink" href="/new" aria-label="Edit design" data-icon="edit"></a>
    </header>

    <div class="dash">
      <div class="dash-scene"><div id="cake"></div></div>
      <button type="button" class="facepile-row" id="facepile" aria-label="Who recorded"></button>

      <div class="dash-actions">
        <button type="button" class="dash-act" id="inviteAct"><i data-icon="send"></i><b>Invite</b><small id="inviteActSub">Friends</small></button>
        <button type="button" class="dash-act" id="voicesAct"><i data-icon="users"></i><b id="voicesActCount">0</b><small>Voices</small></button>
        <button type="button" class="dash-act dark" id="sendAct"><i data-icon="gift"></i><b>Send</b><small id="sendActSub">Gift</small></button>
      </div>

      <!-- the sheets' contents: kept in the page, moved into a sheet when its button is tapped -->
      <div class="dash-panel stack" id="invitePanel" hidden>
        <p class="lead" id="inviteLead"></p>
        <div class="linkbox"><span id="friendLink"></span><button type="button" id="copyFriend"></button></div>
        <div id="waBtn"></div>
      </div>

      <div class="dash-panel stack" id="voicesPanel" hidden>
        <div class="who-list" id="list"></div>
        <!-- for showing the app without real people: made-up voices (never training data) -->
        <div class="row-wrap demo-row">
          <button type="button" class="soft-btn" id="refresh"><i data-icon="refresh"></i><span>Refresh</span></button>
          <button type="button" class="soft-btn" id="demoBtn"></button>
          <button type="button" class="soft-btn" id="demoMoreBtn" hidden></button>
        </div>
        <p class="tiny muted" style="margin:0">Demo voices are samples, never training data.</p>
      </div>

      <div class="dash-panel stack" id="sendPanel" hidden>
        <p class="lead" id="sendLead"></p>
        <button type="button" class="nav-row pin-row" id="pinRow">
          <span class="nav-ico" data-icon="key"></span>
          <div class="nav-info"><b>PIN</b><small>They type it to open</small></div>
          <span class="nav-val t-num" id="pinVal">1234</span>
          <span class="nav-chev" data-icon="chevronRight"></span>
        </button>
        <div id="recipientBox" class="stack" style="gap:12px"></div>
      </div>

      <button class="btn link delete-link" id="deleteGift">Delete this gift</button>
    </div>
  </section>
</main>
<script type="module" src="/assets/manage.js"></script>
</body>
</html>
