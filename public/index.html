<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0F">
<title>Voice Gift — speech-to-text voice transfer studio</title>
<meta name="description" content="Friends record 15s voice transfers and verify AI speech-to-text captions. Unveiled together as one surprise.">
<meta property="og:title" content="Voice Gift">
<meta property="og:description" content="Friends record secret voice messages. Unveiled together as one surprise.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="home">
    <div class="web-grid">
      <div class="web-col">
        <!-- 1. Purrweb Dribbble Emerald Hero Card (#266A61) -->
        <div class="hero-card">
          <div class="hero-top">
            <div class="hero-greeting" id="menuToggle" role="button" tabindex="0" style="cursor:pointer" title="Open navigation sheet">
              <span class="hero-menu-ico" id="logo"></span>
              <span class="hero-greeting-text">
                <small id="greetingTime">good evening,</small>
                <b id="greetingName">Sari</b>
              </span>
            </div>
            <button type="button" class="hero-bell" id="bellBtn" aria-label="Activity and account notifications">
              <span id="bellIco"></span>
              <span class="hero-bell-dot"></span>
            </button>
          </div>

          <div class="hero-balance">
            <div class="hero-balance-label">
              <span id="corpusLabel">speech-to-text corpus</span>
              <button type="button" class="hero-eye" id="eyeToggle" aria-label="Toggle metric view" title="Switch ASR metric"></button>
            </div>
            <div class="hero-balance-val" id="heroMetric">14 voices · 98%</div>
          </div>

          <div class="dual-pills">
            <button type="button" class="pill-btn dark" id="recordQuickBtn">
              <span>record</span>
            </button>
            <a class="pill-btn light" href="/new" id="createLink">
              <span>send</span>
            </a>
          </div>
        </div>

        <!-- 2. Purrweb Dribbble "quick send" Squircle Avatar Rail -->
        <div class="stack" style="gap:10px">
          <div class="sec-bar">
            <h2>quick send</h2>
            <button type="button" class="sec-action" id="viewAllQuick">view all</button>
          </div>
          <div class="sq-rail" id="quickRail">
            <a class="sq-person" href="/new" aria-label="Create new voice gift">
              <span class="sq-person-tile" id="quickPlusTile" style="background:var(--panel);color:#fff"></span>
              <span class="sq-person-name">new</span>
            </a>
            <button type="button" class="sq-person" data-person="dimas">
              <span class="sq-person-tile" style="background:linear-gradient(145deg,#389B8E,#1B544C)">
                D
                <span class="sq-person-tag">13v</span>
              </span>
              <span class="sq-person-name">dimas</span>
            </button>
            <button type="button" class="sq-person" data-person="nadia">
              <span class="sq-person-tile" style="background:linear-gradient(145deg,#E2A04A,#8C5818)">
                N
                <span class="sq-person-tag">grad</span>
              </span>
              <span class="sq-person-name">nadia</span>
            </button>
            <button type="button" class="sq-person" data-person="rina">
              <span class="sq-person-tile" style="background:linear-gradient(145deg,#5E8CE6,#2B4C8C)">
                R
                <span class="sq-person-tag">wed</span>
              </span>
              <span class="sq-person-name">rina</span>
            </button>
            <button type="button" class="sq-person" data-person="budi">
              <span class="sq-person-tile" style="background:linear-gradient(145deg,#9E7CF4,#523696)">
                B
                <span class="sq-person-tag">asr</span>
              </span>
              <span class="sq-person-name">budi</span>
            </button>
          </div>
        </div>
      </div>

      <div class="web-col">
        <!-- 3. Purrweb Dribbble "history" 2-Column Bento Cards (Speech-to-Text & Voice Transfers) -->
        <div class="stack" style="gap:10px">
          <div class="sec-bar">
            <h2>history</h2>
            <button type="button" class="sec-action" id="viewAllHistory">view all</button>
          </div>
          <div class="bento-grid" id="historyGrid">
            <button type="button" class="bento-card" data-history="budi" style="text-align:left;cursor:pointer">
              <div class="bento-top">
                <span class="avatar" style="background:#389B8E;color:#fff;width:32px;height:32px;border-radius:10px;font-size:12px">B</span>
                <div class="bento-meta">
                  <b>Budi</b>
                  <span>03/11/2026 · id-ID</span>
                </div>
              </div>
              <div class="bento-val">
                <span class="tag-plus">+ 14 words</span>
              </div>
            </button>

            <button type="button" class="bento-card" data-history="siti" style="text-align:left;cursor:pointer">
              <div class="bento-top">
                <span class="avatar" style="background:#E2A04A;color:#0F0F0F;width:32px;height:32px;border-radius:10px;font-size:12px">S</span>
                <div class="bento-meta">
                  <b>Siti</b>
                  <span>03/11/2026 · typo fix</span>
                </div>
              </div>
              <div class="bento-val">
                <span>+ 1 fixed</span>
              </div>
            </button>

            <button type="button" class="bento-card" data-history="dimas" style="text-align:left;cursor:pointer">
              <div class="bento-top">
                <span class="avatar" style="background:#5E8CE6;color:#fff;width:32px;height:32px;border-radius:10px;font-size:12px">D</span>
                <div class="bento-meta">
                  <b>Dimas</b>
                  <span>03/11/2026 · birthday</span>
                </div>
              </div>
              <div class="bento-val">
                <span class="tag-plus">+ 13 voices</span>
              </div>
            </button>

            <button type="button" class="bento-card" data-history="nadia" style="text-align:left;cursor:pointer">
              <div class="bento-top">
                <span class="avatar" style="background:#9E7CF4;color:#fff;width:32px;height:32px;border-radius:10px;font-size:12px">N</span>
                <div class="bento-meta">
                  <b>Nadia</b>
                  <span>02/11/2026 · 16 khz</span>
                </div>
              </div>
              <div class="bento-val">
                <span>+ 99% asr</span>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Established App Bottom Navigation Bar -->
    <nav class="app-tabbar" aria-label="App navigation">
      <a class="tab-item on" href="/"><span id="tabHome"></span><span>home</span></a>
      <a class="tab-item" href="/new"><span id="tabNew"></span><span>send gift</span></a>
      <a class="tab-item" href="/g/dimas-igdw"><span id="tabAsr"></span><span>asr studio</span></a>
      <a class="tab-item" href="/account" id="tabProfileLink"><span id="tabProf"></span><span>profile</span></a>
    </nav>
  </section>
</main>
<script type="module">
import { $, $$, h, api, icon, initials, toast, openSheet, closeSheet } from '/assets/common.js';
import { createScene } from '/assets/themes.js';
import { me } from '/assets/auth.js';

$('#logo').innerHTML = icon.menu(18);
$('#bellIco').innerHTML = icon.bell(16);
$('#eyeToggle').innerHTML = icon.eye(16);
$('#quickPlusTile').innerHTML = icon.plus(20);
$('#tabHome').innerHTML = icon.home(17);
$('#tabNew').innerHTML = icon.gift(17);
$('#tabAsr').innerHTML = icon.mic(17);
$('#tabProf').innerHTML = icon.user(17);

const hr = new Date().getHours();
$('#greetingTime').textContent = hr < 12 ? 'good morning,' : hr < 18 ? 'good afternoon,' : 'good evening,';

// Toggle between ASR corpus metrics when the eye icon is tapped (like Dribbble balance eye toggle)
const METRICS = [
  { label: 'speech-to-text corpus', val: '14 voices · 98%', eye: 'eye' },
  { label: 'verified word alignments', val: '112 words · 68s', eye: 'eye' },
  { label: 'speech-to-text corpus', val: '•••• · •••%', eye: 'eyeOff' }
];
let metricIdx = 0;
$('#eyeToggle').addEventListener('click', () => {
  metricIdx = (metricIdx + 1) % METRICS.length;
  const m = METRICS[metricIdx];
  $('#corpusLabel').textContent = m.label;
  $('#heroMetric').textContent = m.val;
  $('#eyeToggle').innerHTML = icon[m.eye](16);
});

// Person / Quick Send Data (opens layered Bottom Sheet on tap!)
const PEOPLE = {
  dimas: {
    name: 'Dimas',
    subtitle: 'birthday voice gift · 13 voices collected',
    occasion: 'birthday',
    cake: { flavor: 'strawberry', name: 'Dimas' },
    candles: 13,
    recordHref: '/g/dimas-igdw',
    openHref: '/r/dimas-igdw?k=fodwtdk1iemng',
    manageHref: '/m/dimas-igdw?k=ffywhsimsfdhs3y'
  },
  nadia: {
    name: 'Nadia, S.Kom.',
    subtitle: 'graduation bouquet · verified speech captions',
    occasion: 'graduation',
    cake: { flavor: 'navy', name: 'Nadia, S.Kom.' },
    candles: 9,
    recordHref: '/new?occasion=graduation',
    openHref: '/new?occasion=graduation',
    manageHref: '/account'
  },
  rina: {
    name: 'Rina & Bayu',
    subtitle: 'wedding sky lanterns · 16 khz wav audio',
    occasion: 'wedding',
    cake: { flavor: 'gold', name: 'Rina & Bayu' },
    candles: 11,
    recordHref: '/new?occasion=wedding',
    openHref: '/new?occasion=wedding',
    manageHref: '/account'
  },
  budi: {
    name: 'Budi Santoso',
    subtitle: 'speech-to-text studio · 15s voice transfer',
    occasion: 'birthday',
    cake: { flavor: 'vanilla', name: 'Dimas' },
    candles: 13,
    recordHref: '/g/dimas-igdw',
    openHref: '/r/dimas-igdw?k=fodwtdk1iemng',
    manageHref: '/m/dimas-igdw?k=ffywhsimsfdhs3y'
  }
};

function openPersonSheet(key) {
  const p = PEOPLE[key] || PEOPLE.dimas;
  const stageBox = h('div', { style: { width: '100%' } });
  openSheet({
    title: p.name.toLowerCase(),
    subtitle: p.subtitle,
    content: [
      h('div', { class: 'stage-showcase', style: { background: 'var(--panel)', borderRadius: '22px', padding: '10px', border: '1px solid var(--line)' } }, stageBox),
      h('div', { class: 'dual-pills' },
        h('a', { class: 'pill-btn dark', href: p.openHref, style: { background: '#222625' } }, 'open reveal'),
        h('a', { class: 'pill-btn light', href: p.recordHref }, 'record 15s voice')
      ),
      h('a', { class: 'nav-row', href: `/new?occasion=${p.occasion}`, style: { borderRadius: '16px', background: 'var(--panel)', border: '1px solid var(--line)', minHeight: '50px' } },
        h('span', { class: 'nav-ico', html: icon.sliders(15) }),
        h('div', { class: 'nav-info' }, h('b', {}, 'customize theme & stickers'), h('small', {}, `${p.occasion} studio`)),
        h('span', { class: 'nav-chev', html: icon.chevronRight(16) })
      )
    ]
  });
  const scene = createScene(stageBox, { occasion: p.occasion, recipient: p.name, cake: p.cake });
  scene.setCandles(p.candles);
  for (let i = 0; i < p.candles; i++) setTimeout(() => scene.light(i), i * 90);
}

$$('#quickRail [data-person]').forEach((btn) => {
  btn.addEventListener('click', () => openPersonSheet(btn.dataset.person));
});

// History / Speech-to-Text Inspector Data (opens layered ASR Bottom Sheet on tap!)
const HISTORY_ITEMS = {
  budi: {
    speaker: 'Budi',
    meta: '03/11/2026 · 16 khz wav · id-ID',
    metric: '+ 14 words · 99% confidence',
    words: [
      { w: 'Selamat', t: '0.18s', ok: true },
      { w: 'ulang', t: '0.52s', ok: true },
      { w: 'tahun', t: '0.88s', ok: true },
      { w: 'Dimas,', t: '1.30s', ok: true, fixed: true },
      { w: 'semoga', t: '1.85s', ok: true },
      { w: 'panjang', t: '2.30s', ok: true },
      { w: 'umur', t: '2.75s', ok: true },
      { w: 'dan', t: '3.10s', ok: true },
      { w: 'sukses', t: '3.48s', ok: true },
      { w: 'selalu!', t: '4.05s', ok: true }
    ],
    href: '/g/dimas-igdw'
  },
  siti: {
    speaker: 'Siti',
    meta: '03/11/2026 · phonetic name repair',
    metric: '1 word repaired · "di mas" → "Dimas"',
    words: [
      { w: 'Happy', t: '0.22s', ok: true },
      { w: 'birthday', t: '0.64s', ok: true },
      { w: 'di mas', fix: 'Dimas', t: '1.15s', ok: false },
      { w: 'wish', t: '1.72s', ok: true },
      { w: 'you', t: '2.04s', ok: true },
      { w: 'all', t: '2.35s', ok: true },
      { w: 'the', t: '2.60s', ok: true },
      { w: 'best!', t: '2.95s', ok: true }
    ],
    href: '/g/dimas-igdw'
  },
  dimas: {
    speaker: 'Dimas · Birthday Gift',
    meta: '13 verified voice transfers · 65s total',
    metric: '+ 13 voices · ready to unveil',
    words: [
      { w: '13', t: 'voices', ok: true },
      { w: '16kHz', t: 'mono PCM', ok: true },
      { w: 'VAD', t: 'trimmed', ok: true },
      { w: '98.4%', t: 'ASR accuracy', ok: true, fixed: true }
    ],
    href: '/r/dimas-igdw?k=fodwtdk1iemng'
  },
  nadia: {
    speaker: 'Nadia · Graduation',
    meta: '02/11/2026 · 16 khz wav · id-ID',
    metric: '+ 99% speech-to-text accuracy',
    words: [
      { w: 'Selamat', t: '0.15s', ok: true },
      { w: 'wisuda', t: '0.60s', ok: true },
      { w: 'Nadia', t: '1.12s', ok: true, fixed: true },
      { w: 'S.Kom.,', t: '1.68s', ok: true },
      { w: 'bangga', t: '2.20s', ok: true },
      { w: 'banget!', t: '2.75s', ok: true }
    ],
    href: '/g/dimas-igdw'
  }
};

function openHistorySheet(key) {
  const item = HISTORY_ITEMS[key] || HISTORY_ITEMS.budi;
  const wordRow = h('div', { class: 'token-preview' });
  item.words.forEach((tok) => {
    const chip = h('button', {
      type: 'button',
      class: `tok ${tok.ok ? (tok.fixed ? 'fixed' : '') : 'suspect'}`,
      title: `Timestamp: ${tok.t}`,
      onclick: () => {
        if (!tok.ok && tok.fix) {
          tok.w = tok.fix;
          tok.ok = true;
          tok.fixed = true;
          chip.className = 'tok fixed';
          chip.textContent = `${tok.w} ✓`;
          toast(`Repaired ASR word → "${tok.w}"`);
        } else {
          toast(`Word aligned at ${tok.t}`);
        }
      }
    }, !tok.ok ? `${tok.w} → ${tok.fix}` : `${tok.w} (${tok.t})`);
    wordRow.append(chip);
  });

  openSheet({
    title: `${item.speaker.toLowerCase()} · speech-to-text`,
    subtitle: item.meta,
    content: [
      h('div', { class: 'card stack', style: { gap: '10px', padding: '14px' } },
        h('div', { class: 'row', style: { justifyContent: 'space-between' } },
          h('span', { class: 'badge-pill green' }, item.metric),
          h('span', { class: 'tiny muted' }, 'tap word to inspect / repair')
        ),
        wordRow
      ),
      h('div', { class: 'dual-pills' },
        h('a', { class: 'pill-btn dark', href: '/m/dimas-igdw?k=ffywhsimsfdhs3y', style: { background: '#222625' } }, 'asr console'),
        h('a', { class: 'pill-btn light', href: item.href }, 'open studio')
      )
    ]
  });
}

$$('#historyGrid [data-history]').forEach((card) => {
  card.addEventListener('click', () => openHistorySheet(card.dataset.history));
});

// Top-left '=' Menu & Top-right Bell open clean layered Mobile Sheets
let currentUser = null;
function openMenuOrAccountSheet(tab = 'nav') {
  openSheet({
    title: currentUser ? `hi, ${currentUser.name.toLowerCase()}` : 'voice gift · menu',
    subtitle: currentUser ? `${currentUser.email} · verified organizer` : 'sign in or explore speech-to-text studio',
    content: [
      h('div', { class: 'nav-list' },
        h('a', { class: 'nav-row', href: '/account' },
          h('span', { class: 'nav-ico', html: icon.user(16) }),
          h('div', { class: 'nav-info' },
            h('b', {}, currentUser ? 'profile & settings' : 'sign in / create account'),
            h('small', {}, currentUser ? 'manage gifts, bio & asr preferences' : 'sync gifts & export asr dataset')
          ),
          h('span', { class: 'nav-val' }, currentUser ? 'active' : 'guest'),
          h('span', { class: 'nav-chev', html: icon.chevronRight(16) })
        ),
        h('a', { class: 'nav-row', href: '/g/dimas-igdw' },
          h('span', { class: 'nav-ico', html: icon.mic(16) }),
          h('div', { class: 'nav-info' },
            h('b', {}, 'record & speech-to-text studio'),
            h('small', {}, '16 khz wav + word-level typo repair')
          ),
          h('span', { class: 'nav-val' }, '15s'),
          h('span', { class: 'nav-chev', html: icon.chevronRight(16) })
        ),
        h('a', { class: 'nav-row', href: '/m/dimas-igdw?k=ffywhsimsfdhs3y' },
          h('span', { class: 'nav-ico', html: icon.sliders(16) }),
          h('div', { class: 'nav-info' },
            h('b', {}, 'organizer asr dashboard'),
            h('small', {}, 'manage voices, qr invite & captions')
          ),
          h('span', { class: 'nav-val' }, '13 voices'),
          h('span', { class: 'nav-chev', html: icon.chevronRight(16) })
        ),
        h('a', { class: 'nav-row', href: '/r/dimas-igdw?k=fodwtdk1iemng' },
          h('span', { class: 'nav-ico', html: icon.gift(16) }),
          h('div', { class: 'nav-info' },
            h('b', {}, 'recipient surprise reveal'),
            h('small', {}, 'blow out candles & play synchronized captions')
          ),
          h('span', { class: 'nav-val' }, 'demo'),
          h('span', { class: 'nav-chev', html: icon.chevronRight(16) })
        )
      ),
      !currentUser && h('button', {
        type: 'button',
        class: 'btn ghost sm',
        style: { width: '100%', minHeight: '44px' },
        onclick: async () => {
          try {
            const { user } = await api('/api/account', {
              method: 'POST',
              json: { action: 'login', email: 'sari@voicegift.id', password: 'password123' }
            });
            currentUser = user;
            $('#greetingName').textContent = user.name.split(' ')[0];
            closeSheet();
            toast(`Signed in as ${user.name}`);
          } catch (e) {
            toast(e.message);
          }
        }
      }, '1-tap demo login · Sari (organizer)')
    ]
  });
}

$('#menuToggle').addEventListener('click', () => openMenuOrAccountSheet('nav'));
$('#bellBtn').addEventListener('click', () => openHistorySheet('siti'));
$('#recordQuickBtn').addEventListener('click', () => openPersonSheet('dimas'));
$('#viewAllQuick').addEventListener('click', () => openPersonSheet('dimas'));
$('#viewAllHistory').addEventListener('click', () => openHistorySheet('budi'));

me().then((u) => {
  if (!u) return;
  currentUser = u;
  $('#greetingName').textContent = u.name.split(' ')[0];
});

const initSheet = new URLSearchParams(location.search).get('sheet');
if (initSheet === 'budi' || initSheet === 'siti') setTimeout(() => openHistorySheet(initSheet), 120);
else if (initSheet === 'dimas' || initSheet === 'nadia') setTimeout(() => openPersonSheet(initSheet), 120);
else if (initSheet === 'menu') setTimeout(() => openMenuOrAccountSheet('nav'), 120);
</script>
</body>
</html>
