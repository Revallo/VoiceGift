<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<title>Friends · Voice Gift</title>
<meta name="description" content="Friends record short voice wishes. They open as one surprise: a cake, a bouquet or lanterns. No app to install.">
<meta property="og:title" content="Voice Gift">
<meta property="og:description" content="Friends record short voice wishes. Each voice lights a candle.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice Gift">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="clean">
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <section data-screen="error" hidden>
    <div class="loading"><h1>Hmm.</h1><p class="lead" id="errorText"></p><a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a></div>
  </section>

  <!-- /u/<code>: someone's friend link -->
  <section data-screen="add" hidden>
    <div class="empty" style="margin-top:18vh">
      <h1 class="page-title" id="addTitle"></h1>
      <p id="addLead"></p>
      <button type="button" class="btn" id="addBtn"></button>
      <a class="linkbtn" href="/" id="addSkip">Not now</a>
    </div>
  </section>

  <!-- /friends: my link, my friends -->
  <section data-screen="friends" hidden>
    <h1 class="page-title">Friends</h1>
    <div class="field">
      <label>Your friend link. Whoever opens it becomes your friend.</label>
      <div class="linkbox"><span id="myLink"></span><button type="button" id="copyLink"></button></div>
      <a class="linkbtn" id="waLink" target="_blank" rel="noopener">Send on WhatsApp</a>
    </div>
    <h2 class="list-title" id="friendsTitle">Your friends</h2>
    <div class="rows" id="friendList"></div>
  </section>
</main>
<script type="module" src="/assets/friends.js"></script>
</body>
</html>
