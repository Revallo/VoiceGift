<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0F">
<meta name="robots" content="noindex">
<title>A voice gift for you</title>
<meta property="og:title" content="A voice gift for you">
<meta property="og:description" content="Your friends made you something. Turn your sound on.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <section data-screen="error" hidden>
    <div class="loading"><h1>Hmm.</h1><p class="lead" id="errorText"></p><a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a></div>
  </section>

  <section data-screen="scene" hidden>
    <div class="web-grid">
      <div class="web-col">
        <div class="hero-card" style="padding:18px 18px 16px;gap:8px">
          <div class="hero-top">
            <a class="hero-greeting" href="/">
              <span class="hero-menu-ico" id="revLogo"></span>
              <span class="hero-greeting-text">
                <small id="eyebrow"></small>
                <b>Voice Gift</b>
              </span>
            </a>
            <span class="badge-pill" style="background:rgba(15,15,15,0.28);color:#fff;border:0">keepsake</span>
          </div>
          <div class="hero-balance">
            <div class="hero-balance-val" id="title" style="font-size:clamp(24px,5.5vw,32px)"></div>
            <p class="small" id="sub" style="margin:2px 0 0;color:rgba(255,255,255,0.78)"></p>
          </div>
        </div>

        <div class="stage-showcase">
          <div id="cake" style="width:100%"></div>
        </div>
      </div>
      <div class="web-col">
        <div id="panel"></div>
        <div id="bottom" class="stack"></div>
      </div>
    </div>
  </section>
</main>
<div class="confetti" id="confetti" hidden></div>
<script type="module" src="/assets/reveal.js"></script>
</body>
</html>
