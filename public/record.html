<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0F">
<title>Record a voice message</title>
<meta property="og:title" content="Record a voice message">
<meta property="og:description" content="15 seconds, straight from your browser. It stays a secret until it opens.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <section data-screen="error" hidden>
    <div class="loading">
      <h1>Hmm.</h1>
      <p class="lead" id="errorText">This gift link doesn’t exist.</p>
      <a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a>
    </div>
  </section>

  <section data-screen="invite" hidden>
    <div class="web-grid">
      <div class="web-col">
        <!-- Purrweb Emerald Hero Card -->
        <div class="hero-card">
          <div class="hero-top">
            <a class="hero-greeting" href="/">
              <span class="hero-menu-ico" data-logo></span>
              <span class="hero-greeting-text">
                <small id="invitedBy">invited you</small>
                <b>Voice Gift</b>
              </span>
            </a>
            <button type="button" class="badge-pill" id="inviteSceneToggle" style="background:rgba(15,15,15,0.28);color:#fff;border:0;cursor:pointer">scene</button>
          </div>

          <div class="hero-balance">
            <div class="hero-balance-label">
              <span>15s voice transfer</span>
              <span id="countLine"></span>
            </div>
            <div class="hero-balance-val" id="inviteTitle" style="font-size:clamp(24px,5.5vw,32px)"></div>
          </div>
        </div>

        <form class="stack" id="inviteForm" novalidate>
          <div class="field">
            <label for="name">your name</label>
            <input class="input" id="name" maxlength="40" autocomplete="given-name" placeholder="Your name" required>
            <p class="small muted wrap" id="signedIn" style="margin:0" hidden></p>
          </div>
          <label class="check">
            <input type="checkbox" id="consent">
            <span>Save my voice &amp; caption for this gift and ASR training.</span>
          </label>
          <p class="small err" id="inviteError" hidden></p>
          <button class="btn emerald-track" type="submit" id="startBtn"></button>
        </form>
      </div>

      <div class="web-col">
        <div class="customize-drawer" id="inviteCakeDrawer" hidden>
          <div class="sec-bar">
            <span class="sec-title">gift scene</span>
            <span class="sec-action">secret until opened</span>
          </div>
          <div class="stage-showcase">
            <div id="inviteCake" style="width:100%"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section data-screen="record" hidden>
    <!-- Purrweb 00:04 Recipient Top Pill + Giant Centered Timer -->
    <div class="recipient-pill">
      <span class="sq-avatar" data-icon="mic"></span>
      <div class="rec-info">
        <b id="recEyebrow">For Dimas</b>
        <span id="tip"></span>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="timer" id="timer">0:00</div>
    <p class="center small muted" style="margin:-4px 0 0">max 0:15 · 16 khz voice</p>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="spacer"></div>
    <button type="button" class="recbtn" id="stopBtn" aria-label="Stop recording"></button>
    <p class="center small muted" style="margin:0">tap to finish</p>
  </section>

  <section data-screen="mic" hidden>
    <div class="head">
      <div class="eyebrow">microphone</div>
      <h1>Microphone needed</h1>
      <p class="lead" id="micHelp"></p>
    </div>
    <div class="linkbox"><span id="pageLink"></span><button type="button" id="copyPage"></button></div>
    <div class="spacer"></div>
    <button class="btn" type="button" id="retryMic">Try again</button>
  </section>

  <section data-screen="uploading" hidden>
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </section>

  <section data-screen="caption" hidden>
    <div class="nav-header">
      <a class="brand" href="/"><span class="logo" data-logo></span>voice gift</a>
      <div class="step-dots" style="margin-left:auto"><i class="done"></i><i class="done"></i><i class="on"></i></div>
    </div>

    <div class="web-grid">
      <div class="web-col">
        <div class="head">
          <h1 id="capTitle"></h1>
        </div>

        <div class="player">
          <button type="button" id="playOwn" aria-label="Play your recording"></button>
          <div class="track" id="playerTrack" title="Click to replay">
            <i id="ownTrack"></i>
            <div class="wave-bars" id="waveBars" aria-hidden="true"></div>
          </div>
          <span class="small muted" id="ownDur"></span>
        </div>

        <div class="typo-studio" id="typoStudio">
          <div class="typo-head">
            <span class="typo-title" id="typoTitle"></span>
            <button type="button" class="fix-all-btn" id="fixAllBtn">fix all</button>
          </div>
          <div class="typo-pills" id="typoPills"></div>
          <div class="token-preview" id="tokenPreview"></div>
        </div>
      </div>

      <div class="web-col">
        <div class="field">
          <div class="row" style="justify-content:space-between">
            <label for="captionText">caption</label>
            <button type="button" class="linkbtn small" id="resetAsrBtn" hidden>reset</button>
          </div>
          <div class="caption-box-wrap">
            <textarea class="input" id="captionText" maxlength="400" aria-label="Caption"></textarea>
            <span class="edit-badge" id="editBadge"></span>
          </div>
        </div>

        <div class="diff-line idle" id="diffLine"></div>

        <p class="note" id="mockNote" hidden></p>
        <p class="small err" id="capError" hidden></p>
        <div class="spacer"></div>
        <div class="row">
          <button type="button" class="btn ghost grow" id="againBtn"></button>
          <button type="button" class="btn grow" id="sendBtn">Send</button>
        </div>
        <p class="center tiny muted" id="secretLine" style="margin:0"></p>
      </div>
    </div>
  </section>

  <section data-screen="done" hidden>
    <div class="web-grid">
      <div class="web-col">
        <!-- Purrweb Emerald Hero Card on Done Screen -->
        <div class="hero-card">
          <div class="hero-balance">
            <div class="hero-balance-label">
              <span>voice transfer saved</span>
              <span id="doneCount"></span>
            </div>
            <div class="hero-balance-val" id="doneTitle" style="font-size:clamp(24px,5.5vw,32px)"></div>
          </div>
          <div class="dual-pills">
            <button type="button" class="pill-btn dark" id="doneSceneToggle">
              <span>view scene</span>
            </button>
            <a class="pill-btn light" href="/new">
              <span>create a gift</span>
            </a>
          </div>
        </div>

        <div class="diff-line" id="asrThanksCard" hidden>
          <span class="diff-check" id="doneCheckIco"></span>
          <span id="asrThanksText"></span>
        </div>
        <p class="small muted center" id="doneLead" style="margin:0"></p>
      </div>

      <div class="web-col">
        <div class="customize-drawer" id="doneCakeDrawer" hidden>
          <div class="stage-showcase">
            <div id="doneCake" style="width:100%"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/assets/record.js"></script>
</body>
</html>
