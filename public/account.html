<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<meta name="robots" content="noindex">
<title>Your account · Voice Gift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <!-- /signup and /login -->
  <!-- Kept simple: the occasion's emoji + colors (from ?occasion= or the ?next= link), a title, the form. -->
  <section data-screen="auth" hidden>
    <a class="backbtn" href="/" id="authBack" aria-label="Back" data-icon="back" hidden></a>
    <div class="stack center" style="gap:6px;margin-top:28px;max-width:440px;width:100%;margin-left:auto;margin-right:auto">
      <div id="authEmoji" style="font-size:3.2rem;line-height:1">🎁</div>
      <h1 id="authTitle" style="font-size:1.5rem;margin:8px 0 0"></h1>
      <p class="small" id="authLead" style="margin:0 0 6px;color:var(--soft)"></p>
      <div id="authBox" style="text-align:left"></div>
    </div>
  </section>

  <!-- /account (Layered Mobile App Architecture: Minimalist rows that open Bottom Sheets on tap) -->
  <section data-screen="me" hidden>
    <a class="backbtn" href="/" aria-label="Back to home" data-icon="back"></a>
    <div class="web-grid">
      <div class="web-col">
        <!-- 1. Party hero card Profile Hero Card -->
        <div class="hero-card">
          <div class="hero-top">
            <div class="hero-greeting" style="flex:1;min-width:0">
                            <span class="hero-avatar-sq" id="acctAvatar" style="width:40px;height:40px;border-radius:13px;background:var(--face);color:var(--text);display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0">S</span>
              <div class="hero-greeting-text" style="min-width:0">
                <small id="meEmail" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></small>
                <b id="hello" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b>
              </div>
            </div>
          </div>

          <div class="hero-balance">
            <div class="hero-balance-label">
              <span id="meBioLabel">Your gifts</span>
            </div>
            <div class="hero-balance-val" id="acctHeroVal">0 voices</div>
          </div>

          <div class="dual-pills">
            <button type="button" class="pill-btn dark" id="openProfileSheetBtn">
              <span data-icon="edit"></span>
              <span>Edit profile</span>
            </button>
            <a class="pill-btn light" href="/new">
              <span data-icon="plus"></span>
              <span>New gift</span>
            </a>
          </div>
        </div>

        <!-- 2. Minimalist Your Gifts Section -->
        <div class="stack" style="gap:10px">
          <div class="sec-bar">
            <h2>Your gifts</h2>
          </div>
          <div class="list" id="gifts"></div>
        </div>
      </div>

      <div class="web-col">
        <!-- 3. Minimalist Progressive-Disclosure Menu Rows (Tap any row to open its Bottom Sheet) -->
        <div class="stack" style="gap:10px">
          <div class="sec-bar">
            <h2>Account &amp; settings</h2>
            <span style="font-size:.74rem;color:var(--muted)">Tap to open</span>
          </div>

          <div class="nav-list">
            <button type="button" class="nav-row" id="rowEditProfile">
              <span class="nav-ico" data-icon="user"></span>
              <div class="nav-info">
                <b>Personal profile</b>
                <small id="rowProfileSub">Display name &amp; organizer bio</small>
              </div>
              <span class="nav-val" id="rowProfileVal">Edit</span>
              <span class="nav-chev" data-icon="chevronRight"></span>
            </button>


          </div>

          <button type="button" class="nav-row" id="logout" style="background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:54px;margin-top:4px">
            <span class="nav-ico" style="background:rgba(255,107,107,0.14);color:var(--coral)" data-icon="lock"></span>
            <div class="nav-info">
              <b style="color:var(--coral)">Log out</b>
              <small>End session on this device</small>
            </div>
            <span class="nav-chev" data-icon="chevronRight"></span>
          </button>
        </div>
      </div>
    </div>

  </section>
</main>
<script type="module" src="/assets/account.js"></script>
</body>
</html>
