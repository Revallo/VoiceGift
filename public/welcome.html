<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<title>Voice Gift — a surprise made of your friends' voices</title>
<meta name="description" content="Friends record short voice wishes. They open as one surprise: a cake, a bouquet or lanterns. No app to install.">
<meta property="og:title" content="Voice Gift">
<meta property="og:description" content="Friends record short voice wishes. Each voice lights a candle.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <!-- The first thing a new visitor sees. First the splash: the candles light one by one and the name appears.
       Then three lines you can swipe through (the gift changes with them), with the ways in underneath. -->
  <section data-screen="welcome" class="welcome splash">
    <div class="welcome-scene" id="scene" aria-hidden="true"></div>
    <p class="welcome-brand">Voice Gift</p>

    <div class="welcome-words" id="words" aria-live="polite">
      <h1 id="line"></h1>
      <p class="lead" id="sub"></p>
    </div>
    <div class="step-dots" id="dots" role="tablist" aria-label="Introduction"></div>

    <div class="spacer"></div>
    <div class="welcome-actions">
      <div id="googleBox" hidden></div>
      <a class="btn" id="signupLink" href="/signup">Sign up with email</a>
      <a class="btn ghost" id="loginLink" href="/login" style="align-self:flex-start">I already have an account</a>
    </div>
  </section>
</main>
<script type="module">
import { $, h } from '/assets/common.js';
import { me, googleButton } from '/assets/auth.js';
import { createScene } from '/assets/themes.js';

// Where to go once logged in: ?next= (same site only), or home.
const nextParam = new URLSearchParams(location.search).get('next') || '';
const next = /^\/(?![/\\])/.test(nextParam) ? nextParam : '';
const withNext = (path) => (next ? `${path}?next=${encodeURIComponent(next)}` : path);
$('#signupLink').href = withNext('/signup');
$('#loginLink').href = withNext('/login');
const goOn = () => location.replace(next || '/');

if (await me()) goOn();
try { localStorage.setItem('vg-welcomed', '1'); } catch {} // next time, a logged-out visit goes straight to log in

const SLIDES = [
  { occasion: 'birthday', name: 'Dimas', line: 'Every voice lights a candle.', sub: 'Friends record a short wish for someone. Fifteen seconds each.' },
  { occasion: 'graduation', name: 'Nadia', line: 'A secret until you send it.', sub: 'Nobody hears a thing before the moment you choose.' },
  { occasion: 'wedding', name: 'Rina & Bayu', line: 'Opened together, kept for good.', sub: 'They listen to everyone, one by one, and keep the page.' }
];
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const section = $('.welcome');
const dots = SLIDES.map((_, i) => h('i', { role: 'tab', 'aria-label': `Part ${i + 1} of ${SLIDES.length}` }));
$('#dots').append(...dots);
let at = -1;
let auto;

function draw(i, lit = true) {
  const s = SLIDES[i];
  const host = $('#scene');
  host.textContent = '';
  const scene = createScene(host, { occasion: s.occasion, recipient: s.name, cake: { name: s.name } });
  scene.setCandles(7);
  if (lit) scene.lightAll();
  return scene;
}

function show(i) {
  at = (i + SLIDES.length) % SLIDES.length;
  const s = SLIDES[at];
  draw(at);
  $('#line').textContent = s.line;
  $('#sub').textContent = s.sub;
  dots.forEach((d, k) => d.classList.toggle('on', k === at));
  const words = $('#words');
  words.classList.remove('in');
  void words.offsetWidth; // restart the fade
  words.classList.add('in');
}

// The splash: an unlit cake, the candles light one by one, then the first line comes in.
function splash() {
  const scene = draw(0, false);
  const end = () => {
    if (!section.classList.contains('splash')) return;
    section.classList.remove('splash');
    show(0);
    if (!still) auto = setInterval(() => show(at + 1), 4200);
  };
  if (still) return end();
  for (let i = 0; i < 7; i++) setTimeout(() => section.classList.contains('splash') && scene.light(i), 350 + i * 190);
  setTimeout(end, 2300);
  section.addEventListener('pointerdown', end, { once: true }); // a tap skips it
}

// Swipe the picture or the words sideways, or tap a dot. Touching it stops the automatic turn.
let x0 = null;
const stop = () => { clearInterval(auto); auto = null; };
for (const el of [$('#scene'), $('#words')]) {
  el.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
  el.addEventListener('pointerup', (e) => {
    if (x0 === null || section.classList.contains('splash')) return;
    const dx = e.clientX - x0;
    x0 = null;
    stop();
    show(at + (dx > 30 ? -1 : 1)); // a tap or a swipe to the left goes on
  });
}
dots.forEach((d, i) => d.addEventListener('click', () => { stop(); show(i); }));

splash();
googleButton($('#googleBox'), goOn);
</script>
</body>
</html>
