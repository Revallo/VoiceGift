<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<title>Create a voice gift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">

  <!-- Step 1 -->
  <section data-screen="who">
    <div class="nav-header">
      <a class="backbtn" id="whoBack" href="/start" aria-label="Back" data-icon="back"></a>
      <div class="step-dots" style="margin-left:auto"><i class="on"></i><i></i></div>
      <a class="backbtn" href="/account" aria-label="Profile" data-icon="user"></a>
    </div>

    <div class="web-grid">
      <div class="web-col">
        <!-- the gift itself, redrawn as soon as you pick another occasion -->
        <div class="who-scene" id="whoPreview"></div>
      </div>

      <div class="web-col">
        <form id="whoForm" class="stack" novalidate>
          <div class="field">
            <span class="label">occasion</span>
            <div class="chips" id="occasions">
              <button type="button" class="chip occ on" data-v="birthday"><span aria-hidden="true">🎂</span>Birthday</button>
              <button type="button" class="chip occ" data-v="graduation"><span aria-hidden="true">🎓</span>Graduation</button>
              <button type="button" class="chip occ" data-v="wedding"><span aria-hidden="true">💍</span>Wedding</button>
            </div>
          </div>
          <div class="field">
            <label for="recipient" id="recipientLabel">Their name</label>
            <input class="input" id="recipient" maxlength="40" autocomplete="off" placeholder="e.g. Dimas" required>
          </div>
          <div class="field">
            <label for="organizer">Your name</label>
            <input class="input" id="organizer" maxlength="40" autocomplete="name" placeholder="e.g. Sari" required>
          </div>
          <div class="nav-list">
            <button type="button" class="nav-row" id="openDeliverySheetBtn">
              <span class="nav-ico" data-icon="shield"></span>
              <div class="nav-info">
                <b>PIN for the gift</b>
                <small>4 digits · they type it to open the gift</small>
              </div>
              <span class="nav-val" id="deliverySummaryVal">1234</span>
              <span class="nav-chev" data-icon="chevronRight"></span>
            </button>
          </div>
          <p class="small err" id="whoError" hidden></p>
          <button class="btn emerald-track" type="submit" id="nextBtn"><span>Next: customize gift</span></button>
        </form>
      </div>
    </div>
  </section>

  <!-- Step 2: Customize Studio -->
  <section data-screen="decorate" hidden>
    <div class="nav-header">
      <button type="button" class="backbtn" data-back aria-label="Back" data-icon="back"></button>
      <div class=" grow" style="min-width:0">
        <b id="decorTitle" style="font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></b>
        <span class="tiny muted" id="decorLead"></span>
      </div>
      <div class="step-dots"><i class="done"></i><i class="on"></i></div>
    </div>

    <div class="web-grid">
      <div class="web-col">
        <div class="stage-showcase">
          <div id="decorCake"></div>
          <div class="shape-nav" aria-live="polite"><button type="button" id="shapePrev" aria-label="Previous kind">‹</button><b id="shapeName"></b><small id="shapeCount"></small><button type="button" id="shapeNext" aria-label="Next kind">›</button></div>
          <p class="tiny muted center" style="margin:0">Swipe the gift or tap the arrows</p>
        </div>
      </div>

      <div class="web-col decor-tools">
        <div class="card stack" id="decorToolsCard" style="gap:14px">
          <div class="row"><span class="label tool" id="swatchLabel">Style</span><div class="wheel" id="flavors"></div></div>
          <div class="row"><span class="label tool" id="accentLabel">Cream</span><div class="wheel" id="accents"></div></div>
          <div class="row"><span class="label tool" id="patternLabel">Pattern</span><div class="wheel" id="patterns"></div></div>
          <div class="row"><span class="label tool" id="topperLabel">Topper</span><div class="wheel" id="toppers"></div></div>
          <div class="row" id="ageRow" hidden><label class="label tool" for="ageRange">Age</label><input type="range" id="ageRange" min="1" max="100" class="grow"><b id="ageVal" style="width:30px;text-align:right"></b></div>
          <div class="row"><span class="label tool">Backdrop</span><div class="wheel" id="backdrops"></div></div>
          <div class="row"><span class="label tool">Music</span><div class="wheel" id="tunes"></div><button type="button" class="seen-play" id="musicPlay" aria-label="Listen to this music"></button></div>
          <div class="field" style="gap:6px"><span class="label">Stickers · drag one onto the gift</span><div class="slider" id="stickerTray"></div></div>
          <div class="row">
            <label class="label tool" for="cakeName" id="nameLabel">Title</label>
            <input class="input" id="cakeName" maxlength="14" style="min-height:44px;flex:1;min-width:0">
          </div>
          <div class="row">
            <span class="label tool">Font</span>
            <div class="wheel" id="fonts"></div>
          </div>
          <div class="row" style="justify-content:space-between" id="drawRow">
            <button type="button" class="btn ghost sm" id="sketchToggle">✏️ Draw</button>
            <div class="wheel" id="brushes" hidden></div>
            <button type="button" class="btn ghost sm" id="clearDraw" hidden>Clear</button>
          </div>
        </div>
        <p class="small err" id="createError" hidden></p>
        <div class="row">
          <button type="button" class="btn grow" id="createBtn">Create the gift</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Between step 2 and 3, only when logged out: a new gift needs an account -->
  <section data-screen="account" hidden>
    <div class="nav-header">
      <button type="button" class="backbtn" data-back aria-label="Back" data-icon="back"></button>
    </div>
    <div class="web-col" style="max-width:420px;width:100%;margin:0 auto">
      <div class="head">
        <h1>Save your gift</h1>
        <p class="small muted" id="accountLead" style="margin:0"></p>
      </div>
      <div id="accountBox"></div>
    </div>
  </section>

</main>
<script type="module" src="/assets/create.js"></script>
</body>
</html>
