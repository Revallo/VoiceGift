<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<title>Voice Gift</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>
  <section data-screen="error" hidden>
    <div class="loading"><h1>Hmm.</h1><p class="lead" id="errorText"></p><a class="btn ghost" href="/">Go to Voice Gift</a></div>
  </section>

  <!-- /u/<handle>: someone's profile link. Their name, a line about them, Follow, and a gift for them. -->
  <section data-screen="profile" hidden>
    <a class="backbtn" href="/" aria-label="Back to home" id="back"></a>
    <div class="profile-head" style="margin-top:5vh">
      <h1 id="name"></h1>
      <small id="bio"></small>
    </div>
    <div id="followBox"></div>
    <a class="btn" id="giftLink" href="/new"></a>
  </section>
</main>
<script type="module">
import { $, api, icon, showScreen } from '/assets/common.js';
import { requireLogin } from '/assets/auth.js';
import { followButton } from '/assets/friends.js';

$('#back').innerHTML = icon.back();
if (await requireLogin()) {
  const handle = location.pathname.split('/').filter(Boolean)[1] || '';
  try {
    const { profile, following, self } = await api('/api/follow?handle=' + encodeURIComponent(handle));
    document.title = `${profile.name} · Voice Gift`;
    $('#name').textContent = profile.name;
    $('#bio').textContent = self ? 'This is your profile link. Send it to friends so they can follow you.' : profile.bio;
    if (self) $('#giftLink').hidden = true;
    else {
      $('#followBox').append(followButton(profile, following));
      $('#giftLink').href = `/new?for=${encodeURIComponent(profile.name)}`;
      $('#giftLink').textContent = `Make a gift for ${profile.name}`;
    }
    showScreen('profile');
  } catch (e) {
    $('#errorText').textContent = e.message;
    showScreen('error');
  }
}
</script>
</body>
</html>
