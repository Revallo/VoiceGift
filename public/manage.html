<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A18">
<meta name="robots" content="noindex">
<title>Gift dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>
  <section data-screen="error" hidden>
    <div class="loading"><h1>Hmm.</h1><p class="lead" id="errorText"></p><a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a></div>
  </section>
  <section data-screen="main" hidden>
    <!-- One page for the organizer: the gift, invite friends, who recorded, send it to the recipient -->
    <div class="nav-header">
      <a class="backbtn" href="/account" aria-label="Back to dashboard" data-icon="back"></a>
      <b class="grow dash-title" id="title">Gift</b>
      <a class="backbtn" href="/account" aria-label="Profile" data-icon="user"></a>
    </div>

    <div class="dash">
      <div class="dash-scene">
        <div id="cake"></div>
        <a class="btn ghost sm" id="editDesignLink" href="/new">✏️ Edit design</a>
      </div>

      <div class="card stack dash-step">
        <div><b class="step-title"><span class="step-n">1</span><span id="inviteTitle">Invite friends to record</span></b>
          <p class="small muted" id="inviteLead" style="margin:4px 0 0"></p></div>
        <div class="linkbox"><span id="friendLink"></span><button type="button" id="copyFriend"></button></div>
        <div id="waBtn"></div>
      </div>

      <div class="card stack dash-step">
        <div class="row" style="justify-content:space-between">
          <b class="step-title"><span class="step-n">2</span><span id="whoTitle">Who recorded</span></b>
          <button type="button" class="linkbtn small" id="refresh">↻ Refresh</button>
        </div>
        <div class="who-list" id="list"></div>
      </div>

      <div class="card stack dash-step">
        <div><b class="step-title"><span class="step-n">3</span><span id="sendTitle">Send it</span></b>
          <p class="small muted" id="sendLead" style="margin:4px 0 0"></p></div>
        <button type="button" class="nav-row pin-row" id="pinRow">
          <span class="nav-ico" data-icon="lock"></span>
          <div class="nav-info"><b>PIN</b><small>They type it to open the gift</small></div>
          <span class="nav-val" id="pinVal">1234</span>
          <span class="nav-chev" data-icon="chevronRight"></span>
        </button>
        <div id="recipientBox"></div>
      </div>

      <button class="btn ghost sm" id="deleteGift" style="align-self:center;color:var(--coral)">Delete this gift</button>
    </div>
  </section>
</main>
<script type="module" src="/assets/manage.js"></script>
</body>
</html>
