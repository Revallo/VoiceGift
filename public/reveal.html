<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1024">
<meta name="robots" content="noindex">
<title>A voice gift for you</title>
<meta property="og:title" content="A voice gift for you">
<meta property="og:description" content="Your friends made you something. Turn your sound on.">
<meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <section data-screen="error" hidden>
    <div class="loading"><h1>Hmm.</h1><p class="lead" id="errorText"></p><a class="btn ghost" href="/" style="max-width:240px">Go to Voice Gift</a></div>
  </section>

  <!-- Step 0 (Only when Recipient has NO Account): Verification Question Gate -->
  <section data-screen="verify" hidden>
    <div class="web-grid">
      <div class="web-col" style="max-width:440px;width:100%;margin:0 auto">
        <div class="hero-card">
          <div class="hero-top">
            <a class="hero-greeting" href="/">
              <span class="hero-menu-ico" id="verLogo"></span>
              <span class="hero-greeting-text">
                <small id="verifyOrganizer">invited you</small>
                <b>Voice Gift</b>
              </span>
            </a>
            <span class="profile-badge" style="background:rgba(27,16,36,0.32);color:#fff;border-color:rgba(255,255,255,0.2)">guest verify</span>
          </div>

          <div class="hero-balance">
            <div class="hero-balance-label">
              <span>recipient verification</span>
              <span id="verifyCountBadge">secret voices</span>
            </div>
            <div class="hero-balance-val" id="verifyHeroTitle" style="font-size:clamp(24px,5.5vw,32px)">For you</div>
          </div>
        </div>

        <form class="card stack" id="verifyForm" style="gap:16px" novalidate>
          <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
            <div class="stack" style="gap:4px">
              <b id="verifyPinTitle" style="font-size:15.5px;color:#fff;line-height:1.4">Masukkan PIN verifikasi untuk membuka voice gift</b>
            </div>
          </div>

          <div class="pin-box-row" id="pinBoxRow" role="group" aria-label="4-digit PIN code">
            <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pin-idx="0" autocomplete="one-time-code" placeholder="•" aria-label="Digit 1">
            <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pin-idx="1" placeholder="•" aria-label="Digit 2">
            <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pin-idx="2" placeholder="•" aria-label="Digit 3">
            <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pin-idx="3" placeholder="•" aria-label="Digit 4">
          </div>
          <input type="hidden" id="verifyPinInput" value="">

          <p class="small err" id="verifyError" hidden style="margin:0;text-align:center"></p>
          <button type="submit" class="btn emerald-track" id="verifySubmitBtn">
            <span>verifikasi pin &amp; buka voice gift</span>
          </button>
        </form>

      </div>
    </div>
  </section>

  <section data-screen="scene" hidden>
    <div class="web-grid">
      <div class="web-col">
        <div class="hero-card" style="padding:18px 18px 16px;gap:8px">
          <div class="hero-top">
            <a class="hero-greeting" href="/">
              <span class="hero-menu-ico" id="revLogo"></span>
              <span class="hero-greeting-text">
                <small id="eyebrow"></small>
                <b>Voice Gift</b>
              </span>
            </a>
            <span class="badge-pill" id="revealAccessBadge" style="background:rgba(27,16,36,0.28);color:#fff;border:0">keepsake</span>
          </div>
          <div class="hero-balance">
            <div class="hero-balance-val" id="title" style="font-size:clamp(24px,5.5vw,32px)"></div>
            <p class="small" id="sub" style="margin:2px 0 0;color:rgba(255,255,255,0.78)"></p>
          </div>
        </div>

        <div class="stage-showcase">
          <div id="cake" style="width:100%"></div>
        </div>
      </div>
      <div class="web-col">
        <div id="panel"></div>
        <div id="bottom" class="stack"></div>
      </div>
    </div>
  </section>
</main>
<div class="confetti" id="confetti" hidden></div>
<script type="module" src="/assets/reveal.js"></script>
</body>
</html>
