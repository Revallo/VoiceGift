<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A0C19">
<meta name="robots" content="noindex">
<title>My gifts · Voice Gift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>
  <section data-screen="main" hidden>
    <div class="topbar"><a class="backbtn" href="/" aria-label="Back to the home page" data-icon="back"></a><a class="brand" href="/" style="font-size:15px"><span class="logo" data-logo style="width:26px;height:26px"></span>Voice Gift</a>
      <button type="button" class="btn ghost sm" id="signOut" style="margin-left:auto">Sign out</button></div>
    <div class="head">
      <div class="eyebrow">My gifts</div>
      <h1 id="hello"></h1>
      <p class="lead" id="email"></p>
    </div>
    <div class="stack" id="received" hidden><h2>For you</h2><div class="list"></div></div>
    <div class="stack" id="made"><h2>Gifts you made</h2><div class="list"></div></div>
    <a class="btn" href="/new" id="newBtn">Create a gift</a>
    <div class="stack" id="recorded" hidden><h2>Messages you recorded</h2><p class="small muted" style="margin:-4px 0 0">Only you and the person you recorded for can hear them.</p><div class="list"></div></div>
  </section>
</main>
<script type="module" src="/assets/me.js"></script>
</body>
</html>
