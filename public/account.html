<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0F">
<meta name="robots" content="noindex">
<title>Your account · Voice Gift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="app" id="app">
  <section data-screen="loading"><div class="loading"><div class="spinner"></div></div></section>

  <!-- /signup and /login -->
  <section data-screen="auth" hidden>
    <div class="nav-header">
      <a class="backbtn" href="/" aria-label="Back to the home page" data-icon="back"></a>
      <a class="brand" href="/"><span class="logo" data-logo></span>voice gift</a>
    </div>
    <div class="web-col" style="max-width:440px;width:100%;margin:0 auto">
      <div class="hero-card" style="padding:18px 20px;gap:10px">
        <div class="row" style="justify-content:space-between">
          <div class="stack" style="gap:2px">
            <span style="font-size:.7rem;color:rgba(255,255,255,0.72);text-transform:lowercase">voice gift · for organizers</span>
            <h1 id="authTitle" style="font-size:1.35rem;margin:0;color:#fff"></h1>
          </div>
        </div>
        <p class="small" id="authLead" style="margin:0;color:rgba(255,255,255,0.82)"></p>
      </div>
      <div id="authBox"></div>
    </div>

    <nav class="app-tabbar" aria-label="Primary navigation">
      <a class="tab-item" href="/new"><span data-icon="plus"></span><span>send gift</span></a>
      <a class="tab-item active" href="/account"><span data-icon="user"></span><span>profile</span></a>
    </nav>
  </section>

  <!-- /account (Layered Mobile App Architecture: Minimalist rows that open Bottom Sheets on tap) -->
  <section data-screen="me" hidden>
    <div class="web-grid">
      <div class="web-col">
        <!-- 1. Purrweb Emerald Profile Hero Card -->
        <div class="hero-card">
          <div class="hero-top">
            <div class="hero-greeting" style="flex:1;min-width:0">
              <a class="backbtn" href="/" aria-label="Back to the home page" data-icon="back" style="width:36px;height:36px;border-radius:12px;background:rgba(15,15,15,0.28);border:0;color:#fff;flex-shrink:0"></a>
              <span class="hero-avatar-sq" id="acctAvatar" style="width:40px;height:40px;border-radius:13px;background:#0F0F0F;color:#7CE8D8;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0">S</span>
              <div class="hero-greeting-text" style="min-width:0">
                <small id="meEmail" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></small>
                <b id="hello" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b>
              </div>
            </div>
            <span class="profile-badge" style="background:rgba(15,15,15,0.32);color:#fff;border-color:rgba(255,255,255,0.22);flex-shrink:0">verified</span>
          </div>

          <div class="hero-balance">
            <div class="hero-balance-label">
              <span id="meBioLabel">your gifts</span>
            </div>
            <div class="hero-balance-val" id="acctHeroVal">0 voices</div>
          </div>

          <div class="dual-pills">
            <button type="button" class="pill-btn dark" id="openProfileSheetBtn">
              <span data-icon="edit"></span>
              <span>edit profile</span>
            </button>
            <a class="pill-btn light" href="/new">
              <span data-icon="plus"></span>
              <span>new gift</span>
            </a>
          </div>
        </div>

        <!-- Gifts Sent Directly to This Account (Direct Account Delivery) -->
        <div class="stack" style="gap:10px" id="receivedSection" hidden>
          <div class="sec-bar">
            <h2>voice gifts sent to you</h2>
            <span style="font-size:.72rem;color:#7CE8D8">direct open · no verify</span>
          </div>
          <div class="nav-list" id="receivedList"></div>
        </div>

        <!-- 2. Minimalist Your Gifts Section -->
        <div class="stack" style="gap:10px">
          <div class="sec-bar">
            <h2>your gifts</h2>
            <a href="/new">+ new</a>
          </div>
          <div class="list" id="gifts"></div>
        </div>
      </div>

      <div class="web-col">
        <!-- 3. Minimalist Progressive-Disclosure Menu Rows (Tap any row to open its Bottom Sheet) -->
        <div class="stack" style="gap:10px">
          <div class="sec-bar">
            <h2>account &amp; settings</h2>
            <span style="font-size:.74rem;color:var(--muted)">tap to open</span>
          </div>

          <div class="nav-list">
            <button type="button" class="nav-row" id="rowEditProfile">
              <span class="nav-ico" data-icon="user"></span>
              <div class="nav-info">
                <b>personal profile</b>
                <small id="rowProfileSub">display name &amp; organizer bio</small>
              </div>
              <span class="nav-val" id="rowProfileVal">edit</span>
              <span class="nav-chev" data-icon="chevronRight"></span>
            </button>


            <button type="button" class="nav-row" id="rowSecurity">
              <span class="nav-ico" data-icon="shield"></span>
              <div class="nav-info">
                <b>security &amp; password</b>
                <small>scrypt N=32768 · active session</small>
              </div>
              <span class="nav-val">update</span>
              <span class="nav-chev" data-icon="chevronRight"></span>
            </button>
          </div>

          <button type="button" class="nav-row" id="logout" style="background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:54px;margin-top:4px">
            <span class="nav-ico" style="background:rgba(255,107,107,0.14);color:var(--coral)" data-icon="lock"></span>
            <div class="nav-info">
              <b style="color:var(--coral)">log out</b>
              <small>end session on this device</small>
            </div>
            <span class="nav-chev" data-icon="chevronRight"></span>
          </button>
        </div>
      </div>
    </div>

    <nav class="app-tabbar" aria-label="Primary navigation">
      <a class="tab-item" href="/new"><span data-icon="plus"></span><span>send gift</span></a>
      <a class="tab-item active" href="/account"><span data-icon="user"></span><span>profile</span></a>
    </nav>
  </section>
</main>
<script type="module" src="/assets/account.js"></script>
</body>
</html>
